    <text id="PFX-num" data-layout-ignore x="0" y="-136" text-anchor="middle" font-family="Inter" font-weight="900" font-size="46" fill="#ffffff" stroke="#1a1a2e" stroke-width="2">9</text>
    <g transform="translate(-54,-196)"><g id="PFX-armL"><rect x="-12" y="0" width="24" height="80" rx="12" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" /><circle cx="0" cy="88" r="15" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" /></g></g>
    <g transform="translate(54,-196)"><g id="PFX-armR"><rect x="-12" y="0" width="24" height="80" rx="12" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" /><circle cx="0" cy="88" r="15" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" /></g></g>
