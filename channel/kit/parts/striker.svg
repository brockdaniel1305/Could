<!-- Tall striker in a plain sky-blue kit with a blond man-bun (Erling-Haaland-style caricature, not a likeness, no badges).
     Origin = between the feet. ~330 tall. Same rig ids as keeper.svg.
     Animatable: PFX (whole), PFX-body, PFX-armL/-armR (rotate, origin top), PFX-legL/-legR, PFX-head,
     PFX-pupL/-pupR (x/y look), PFX-browL/-browR, PFX-m-smile / -m-o / -m-flat (show one), PFX-lids (blink). -->
