<!-- Fast forward in a plain kit, very short dark hair (Kylian-Mbappe-style caricature, not a likeness, no badges). Kit colours:
     KITC (shirt), SHORTC, SOCKC, NUMC (defaults navy/navy/navy/white via part(..., KITC=...)). Extra: PFX-sash and PFX-crown (opacity 0).
     Origin = between the feet. ~330 tall. Same rig ids as keeper.svg.
     Animatable: PFX (whole), PFX-body, PFX-armL/-armR (rotate, origin top), PFX-legL/-legR, PFX-head,
     PFX-pupL/-pupR (x/y look), PFX-browL/-browR, PFX-m-smile / -m-o / -m-flat (show one), PFX-lids (blink). -->
<g id="PFX">
  <ellipse cx="0" cy="4" rx="58" ry="10" fill="#000" opacity="0.25" />
  <g id="PFX-body">
    <g id="PFX-legL"><rect x="-32" y="-96" width="26" height="96" rx="10" fill="#8a5a3c" stroke="#1a1a2e" stroke-width="5" /><rect x="-34" y="-44" width="28" height="34" rx="6" fill="SOCKC" stroke="#1a1a2e" stroke-width="4" /><ellipse cx="-22" cy="-6" rx="22" ry="11" fill="#1a1a2e" /></g>
    <g id="PFX-legR"><rect x="6" y="-96" width="26" height="96" rx="10" fill="#8a5a3c" stroke="#1a1a2e" stroke-width="5" /><rect x="6" y="-44" width="28" height="34" rx="6" fill="SOCKC" stroke="#1a1a2e" stroke-width="4" /><ellipse cx="22" cy="-6" rx="22" ry="11" fill="#1a1a2e" /></g>
    <rect x="-40" y="-118" width="80" height="40" rx="10" fill="SHORTC" stroke="#1a1a2e" stroke-width="5" />
    <path d="M-50,-200 Q-56,-128 -42,-112 L42,-112 Q56,-128 50,-200 Q0,-216 -50,-200 Z" fill="KITC" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
    <path d="M-20,-205 L0,-186 L20,-205" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" />
    <g id="PFX-sash" opacity="0"><path d="M-46,-204 L-30,-210 L48,-122 L34,-114 Z" fill="#1d3f9b" stroke="#1a1a2e" stroke-width="3" /><path d="M-30,-210 L-16,-212 L50,-134 L48,-122 Z" fill="#f4f4f2" /><path d="M-16,-212 L-4,-212 L50,-146 L50,-134 Z" fill="#c0262d" /></g>
    <text id="PFX-num" data-layout-ignore x="0" y="-136" text-anchor="middle" font-family="Inter" font-weight="900" font-size="46" fill="NUMC" stroke="#1a1a2e" stroke-width="2">10</text>
    <g transform="translate(-54,-196)"><g id="PFX-armL"><rect x="-12" y="0" width="24" height="80" rx="12" fill="#8a5a3c" stroke="#1a1a2e" stroke-width="5" /><circle cx="0" cy="88" r="15" fill="#8a5a3c" stroke="#1a1a2e" stroke-width="5" /></g></g>
