<!-- Cartoon fighting bull (Pamplona). Two views in one part; the 3D engine shows one of them by the bull's direction of travel:
     .v-side  side view, facing RIGHT (flip with scaleX -1), ~300 long, ~230 tall
     .v-front head-on view (charging at the camera), ~230 tall
     Origin = on the ground between the hooves. Legs that swing together carry class legA / legB (rotate about their top).
     Animatable: PFX (whole), PFX-pupL/-pupR (look), PFX-stars (dizzy, opacity). -->
<g id="PFX">
  <g class="v-side">
    <path d="M-150,-150 Q-178,-120 -170,-74" fill="none" stroke="#1a1a2e" stroke-width="7" stroke-linecap="round" />
    <path d="M-176,-82 l-10,16 l14,-4 z" fill="#1a1a2e" />
    <g class="legB"><rect x="-128" y="-92" width="26" height="92" rx="10" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="5" /><rect x="-130" y="-14" width="30" height="14" rx="4" fill="#111" /></g>
    <g class="legA"><rect x="-96" y="-92" width="26" height="92" rx="10" fill="#33241f" stroke="#1a1a2e" stroke-width="5" /><rect x="-98" y="-14" width="30" height="14" rx="4" fill="#111" /></g>
    <g class="legA"><rect x="56" y="-92" width="26" height="92" rx="10" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="5" /><rect x="54" y="-14" width="30" height="14" rx="4" fill="#111" /></g>
    <g class="legB"><rect x="88" y="-92" width="26" height="92" rx="10" fill="#33241f" stroke="#1a1a2e" stroke-width="5" /><rect x="86" y="-14" width="30" height="14" rx="4" fill="#111" /></g>
    <path d="M-150,-120 Q-160,-190 -60,-196 Q40,-224 110,-196 Q150,-170 130,-110 Q120,-78 60,-78 L-110,-80 Q-148,-84 -150,-120 Z" fill="#3a2a24" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round" />
    <path d="M-40,-200 Q20,-232 90,-204" fill="none" stroke="#4a372f" stroke-width="10" stroke-linecap="round" />
    <g transform="translate(150,-150)">
      <path d="M-20,-38 Q-40,-80 -6,-92" fill="none" stroke="#f1e6cf" stroke-width="13" stroke-linecap="round" />
      <path d="M-20,-38 Q-40,-80 -6,-92" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" opacity="0.5" />
      <path d="M-44,-40 Q-30,-64 10,-56 Q56,-48 60,-6 Q62,26 40,36 Q10,46 -16,30 Q-48,10 -44,-40 Z" fill="#3a2a24" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round" />
      <ellipse cx="44" cy="20" rx="20" ry="16" fill="#8a5f52" stroke="#1a1a2e" stroke-width="4" />
      <circle cx="50" cy="16" r="3.5" fill="#1a1a2e" />
      <circle cx="44" cy="30" r="9" fill="none" stroke="#ffd23f" stroke-width="4" />
      <ellipse cx="8" cy="-14" rx="12" ry="11" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <circle id="PFX-pupR" cx="12" cy="-12" r="5" fill="#1a1a2e" />
      <path d="M-6,-30 L22,-22" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" />
      <path d="M-30,-40 Q-44,-50 -40,-30 Z" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="3" />
    </g>
  </g>
  <g class="v-front">
    <g class="legA"><rect x="-58" y="-96" width="30" height="96" rx="10" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="5" /><rect x="-60" y="-14" width="34" height="14" rx="4" fill="#111" /></g>
    <g class="legB"><rect x="28" y="-96" width="30" height="96" rx="10" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="5" /><rect x="26" y="-14" width="34" height="14" rx="4" fill="#111" /></g>
    <path d="M-92,-90 Q-110,-170 -60,-196 Q0,-216 60,-196 Q110,-170 92,-90 Q60,-70 0,-72 Q-60,-70 -92,-90 Z" fill="#3a2a24" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round" />
    <g transform="translate(0,-150)">
      <path d="M-44,-40 Q-100,-46 -110,-96" fill="none" stroke="#f1e6cf" stroke-width="15" stroke-linecap="round" />
      <path d="M44,-40 Q100,-46 110,-96" fill="none" stroke="#f1e6cf" stroke-width="15" stroke-linecap="round" />
      <path d="M-44,-40 Q-100,-46 -110,-96 M44,-40 Q100,-46 110,-96" fill="none" stroke="#1a1a2e" stroke-width="3" opacity="0.45" />
      <path d="M-62,-44 L-86,-58 L-70,-30 Z M62,-44 L86,-58 L70,-30 Z" fill="#2a1e1a" stroke="#1a1a2e" stroke-width="4" stroke-linejoin="round" />
      <path d="M-50,-50 Q0,-74 50,-50 Q60,10 34,52 Q0,70 -34,52 Q-60,10 -50,-50 Z" fill="#3a2a24" stroke="#1a1a2e" stroke-width="6" stroke-linejoin="round" />
      <path d="M-14,-62 Q0,-48 14,-62" fill="none" stroke="#4a372f" stroke-width="7" stroke-linecap="round" />
      <ellipse cx="-20" cy="-10" rx="13" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <ellipse cx="20" cy="-10" rx="13" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <circle id="PFX-pupL" cx="-18" cy="-8" r="5.5" fill="#1a1a2e" />
      <circle cx="22" cy="-8" r="5.5" fill="#1a1a2e" />
      <path d="M-36,-30 L-8,-22 M36,-30 L8,-22" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" />
      <ellipse cx="0" cy="36" rx="30" ry="20" fill="#8a5f52" stroke="#1a1a2e" stroke-width="4" />
      <circle cx="-12" cy="34" r="4.5" fill="#1a1a2e" /><circle cx="12" cy="34" r="4.5" fill="#1a1a2e" />
      <circle cx="0" cy="52" r="11" fill="none" stroke="#ffd23f" stroke-width="5" />
    </g>
    <g class="steam" opacity="0"><circle cx="-26" cy="-96" r="12" fill="#f4f1ea" opacity="0.9" /><circle cx="26" cy="-96" r="12" fill="#f4f1ea" opacity="0.9" /><circle cx="-36" cy="-84" r="8" fill="#f4f1ea" opacity="0.7" /><circle cx="36" cy="-84" r="8" fill="#f4f1ea" opacity="0.7" /></g>
  </g>
  <g id="PFX-stars" opacity="0" transform="translate(0,-250)">
    <path d="M-50,0 l6,-14 l6,14 l-14,-8 h16 z M0,-20 l6,-14 l6,14 l-14,-8 h16 z M50,0 l6,-14 l6,14 l-14,-8 h16 z" fill="#ffd23f" stroke="#1a1a2e" stroke-width="2" />
  </g>
</g>
