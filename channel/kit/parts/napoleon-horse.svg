      <path d="M2,-14 L22,-12" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" /><path d="M20,8 L32,12 L22,16" fill="none" stroke="#1a1a2e" stroke-width="3" />
      <path d="M8,24 L26,22" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" />
      <path d="M-90,-26 Q0,-104 90,-26 Q0,-46 -90,-26 Z" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="4" stroke-linejoin="round" />
      <circle cx="0" cy="-52" r="9" fill="#1d3f9b" stroke="#c0262d" stroke-width="4" />
      <g id="PFX-crown" opacity="0" transform="translate(0,-74)"><path d="M-40,10 L-44,-30 L-22,-10 L0,-36 L22,-10 L44,-30 L40,10 Z" fill="#ffd23f" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" /></g>
    </g>
  </g>
</g>
