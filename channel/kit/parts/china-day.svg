  <rect x="346" y="530" width="28" height="40" fill="#b59a72" stroke="#1a1a2e" stroke-width="3" /><rect x="586" y="510" width="28" height="40" fill="#b59a72" stroke="#1a1a2e" stroke-width="3" /><rect x="826" y="490" width="28" height="40" fill="#b59a72" stroke="#1a1a2e" stroke-width="3" />
