  <rect x="0" y="0" width="1080" height="1920" fill="url(#PFX-sky)" />
  <circle cx="860" cy="420" r="60" fill="#ffd56a" stroke="#1a1a2e" stroke-width="4" opacity="0.9" />
  <g id="PFX-cloud1" fill="#fff" stroke="#1a1a2e" stroke-width="4"><path d="M120,330 q30,-40 70,-10 q30,-30 60,0 q30,10 10,40 l-150,0 q-20,-10 10,-30 z" /></g>
