<!-- Cartoon lion, side view facing LEFT. Origin = ground under the body. ~380 long. Two poses: PFX-stand and PFX-sit (show one).
     Animatable: PFX, PFX-stand / PFX-sit, PFX-tail, PFX-legF / PFX-legB (stand pose), PFX-jaw, PFX-pup, PFX-brow, PFX-q (question mark). -->
<g id="PFX">
  <ellipse cx="0" cy="4" rx="150" ry="12" fill="#000" opacity="0.25" />
  <g id="PFX-stand">
    <g id="PFX-tail"><path d="M130,-120 Q210,-150 200,-60" fill="none" stroke="#1a1a2e" stroke-width="12" stroke-linecap="round" /><path d="M130,-120 Q210,-150 200,-60" fill="none" stroke="#d9a14a" stroke-width="6" stroke-linecap="round" /><circle cx="200" cy="-56" r="14" fill="#8a5a24" stroke="#1a1a2e" stroke-width="4" /></g>
    <g transform="translate(90,-80)"><g id="PFX-legB"><rect x="-18" y="0" width="36" height="78" rx="14" fill="#d9a14a" stroke="#1a1a2e" stroke-width="5" /></g></g>
    <ellipse cx="20" cy="-110" rx="130" ry="56" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" />
    <g transform="translate(-60,-80)"><g id="PFX-legF"><rect x="-18" y="0" width="36" height="78" rx="14" fill="#d9a14a" stroke="#1a1a2e" stroke-width="5" /></g></g>
    <g transform="translate(-110,-150)"><g id="PFX-head">
      <circle cx="0" cy="0" r="78" fill="#8a5a24" stroke="#1a1a2e" stroke-width="5" />
      <circle cx="-14" cy="6" r="50" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" />
      <ellipse cx="-34" cy="-6" rx="9" ry="11" fill="#1a1a2e" /><ellipse cx="4" cy="-6" rx="9" ry="11" fill="#1a1a2e" />
      <circle id="PFX-pup" cx="-30" cy="-9" r="3" fill="#fff" />
      <path id="PFX-brow" d="M-48,-24 L-24,-18 M-8,-18 L16,-24" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" />
      <path d="M-26,14 L-14,24 L-2,14 Z" fill="#5a2e1a" />
      <g id="PFX-jaw"><path d="M-40,30 Q-14,52 12,30" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" /></g>
    </g></g>
  </g>
  <g id="PFX-sit" opacity="0">
    <path d="M150,-10 Q230,-30 210,-100" fill="none" stroke="#1a1a2e" stroke-width="12" stroke-linecap="round" /><path d="M150,-10 Q230,-30 210,-100" fill="none" stroke="#d9a14a" stroke-width="6" stroke-linecap="round" />
    <path d="M-40,0 Q-60,-150 20,-200 Q120,-200 150,-60 Q160,0 120,0 Z" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
    <rect x="-56" y="-90" width="34" height="92" rx="14" fill="#d9a14a" stroke="#1a1a2e" stroke-width="5" />
    <g transform="translate(-20,-230)"><circle cx="0" cy="0" r="78" fill="#8a5a24" stroke="#1a1a2e" stroke-width="5" /><circle cx="-14" cy="6" r="50" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" />
      <ellipse cx="-34" cy="-6" rx="9" ry="11" fill="#1a1a2e" /><ellipse cx="4" cy="-6" rx="9" ry="11" fill="#1a1a2e" />
      <path d="M-48,-30 L-24,-22 M-8,-22 L16,-30" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" />
      <path d="M-26,14 L-14,24 L-2,14 Z" fill="#5a2e1a" /><path d="M-30,36 L4,36" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" /></g>
  </g>
  <g id="PFX-q" opacity="0" transform="translate(60,-370)"><circle r="40" fill="#fff" stroke="#1a1a2e" stroke-width="5" /><text y="18" text-anchor="middle" font-family="Inter" font-weight="900" font-size="54" fill="#1a1a2e">?</text></g>
</g>
