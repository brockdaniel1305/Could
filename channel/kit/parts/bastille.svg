="5" /><rect x="30" y="-800" width="24" height="44" fill="#8c8578" stroke="#1a1a2e" stroke-width="5" /><rect x="70" y="-800" width="24" height="44" fill="#8c8578" stroke="#1a1a2e" stroke-width="5" /><path d="M-90,-600 L90,-600 M-90,-420 L90,-420 M-90,-240 L90,-240" stroke="#6f685e" stroke-width="5" /><rect x="-12" y="-560" width="24" height="60" rx="10" fill="#1a1a2e" /></g>
