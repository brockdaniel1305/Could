<!-- Murmillo gladiator: crested helmet with grille, big rectangular shield (left arm), short sword (right arm). Origin = feet. ~330 tall.
     Animatable: PFX, PFX-body, PFX-head, PFX-armL/-armR, PFX-legL/-legR, PFX-shield (front, can break: PFX-shieldL/-shieldR halves), PFX-sword, PFX-pupL/-pupR, PFX-brow. -->
<g id="PFX"><ellipse cx="0" cy="4" rx="60" ry="10" fill="#000" opacity="0.25" />
