    <path d="M-46,-206 Q-52,-150 -40,-130 L40,-130 Q52,-150 46,-206 Q0,-220 -46,-206 Z" fill="#d9a77a" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
