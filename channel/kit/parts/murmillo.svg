    <g transform="translate(56,-200)"><g id="PFX-armR"><rect x="-12" y="0" width="24" height="78" rx="12" fill="#d9a77a" stroke="#1a1a2e" stroke-width="5" /><rect x="-14" y="10" width="28" height="40" rx="6" fill="#c9a24a" stroke="#1a1a2e" stroke-width="4" /><g id="PFX-sword"><rect x="-5" y="86" width="10" height="90" rx="3" fill="#cfd8dc" stroke="#1a1a2e" stroke-width="4" /><rect x="-16" y="80" width="32" height="10" rx="3" fill="#7a5230" stroke="#1a1a2e" stroke-width="3" /></g><circle cx="0" cy="86" r="15" fill="#d9a77a" stroke="#1a1a2e" stroke-width="5" /></g></g>
    
    <g transform="translate(0,-250)"><g id="PFX-head">
