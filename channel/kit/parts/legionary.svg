     PFX-pupL/-pupR, PFX-browL/-browR, PFX-m-flat (default) / PFX-m-o / PFX-m-wavy, PFX-swirl (dizzy eyes, opacity 0),
     PFX-sweat (opacity 0), PFX-stars (opacity 0; rotate PFX-rotor to orbit the stars). -->
