<!-- Hadrian's Wall, end view (cross-section) so a free kick can fly over it. Origin = ground centre. Drawn at 100 px/m:
     about 4.5 m tall (estimated, sources say 4-6 m), 3 m wide, with a walkway parapet. Scale in the scene (e.g. 0.65 for 65 px/m).
     Animatable: PFX (rise: scaleY from the ground), PFX-crack. -->
