<!-- Manuel-Neuer-style goalkeeper (caricature, not a likeness). Origin = between the feet. ~300 tall.
     Animatable: PFX (whole), PFX-body, PFX-armL/-armR (rotate, origin top), PFX-legL/-legR, PFX-head,
     PFX-pupL/-pupR (x/y look), PFX-browL/-browR, PFX-m-smile / -m-o / -m-flat (show one), PFX-lids (blink). -->
<g id="PFX">
  <ellipse cx="0" cy="4" rx="58" ry="10" fill="#000" opacity="0.25" />
  <g id="PFX-body">
    <g id="PFX-legL"><rect x="-32" y="-96" width="26" height="88" rx="10" fill="#8be04e" stroke="#1a1a2e" stroke-width="5" /><ellipse cx="-22" cy="-6" rx="22" ry="11" fill="#1a1a2e" /></g>
    <g id="PFX-legR"><rect x="6" y="-96" width="26" height="88" rx="10" fill="#8be04e" stroke="#1a1a2e" stroke-width="5" /><ellipse cx="22" cy="-6" rx="22" ry="11" fill="#1a1a2e" /></g>
    <rect x="-40" y="-118" width="80" height="40" rx="10" fill="#22222c" stroke="#1a1a2e" stroke-width="5" />
    <path d="M-50,-200 Q-56,-128 -42,-112 L42,-112 Q56,-128 50,-200 Q0,-216 -50,-200 Z" fill="#8be04e" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
    <path d="M-20,-205 L0,-186 L20,-205" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" />
    <text data-layout-ignore x="0" y="-136" text-anchor="middle" font-family="Inter" font-weight="900" font-size="46" fill="#ffffff" stroke="#1a1a2e" stroke-width="2">1</text>
    <g transform="translate(-54,-196)"><g id="PFX-armL"><rect x="-13" y="0" width="26" height="74" rx="13" fill="#8be04e" stroke="#1a1a2e" stroke-width="5" /><circle cx="0" cy="88" r="25" fill="#ffffff" stroke="#1a1a2e" stroke-width="5" /><rect x="-22" y="70" width="44" height="10" rx="4" fill="#ff7a1a" /></g></g>
    <g transform="translate(54,-196)"><g id="PFX-armR"><rect x="-13" y="0" width="26" height="74" rx="13" fill="#8be04e" stroke="#1a1a2e" stroke-width="5" /><circle cx="0" cy="88" r="25" fill="#ffffff" stroke="#1a1a2e" stroke-width="5" /><rect x="-22" y="70" width="44" height="10" rx="4" fill="#ff7a1a" /></g></g>
    <g transform="translate(0,-250)"><g id="PFX-head">
      <circle cx="-44" cy="4" r="10" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" />
      <circle cx="44" cy="4" r="10" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" />
      <ellipse cx="0" cy="0" rx="44" ry="50" fill="#f0c49a" stroke="#1a1a2e" stroke-width="5" />
      <path d="M-46,-8 Q-50,-58 0,-58 Q50,-58 46,-8 Q36,-34 0,-36 Q-30,-36 -46,-8 Z" fill="#d9b45a" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
      <ellipse cx="-16" cy="0" rx="11" ry="13" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <ellipse cx="16" cy="0" rx="11" ry="13" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <circle id="PFX-pupL" cx="-15" cy="2" r="5.5" fill="#1a1a2e" />
      <circle id="PFX-pupR" cx="17" cy="2" r="5.5" fill="#1a1a2e" />
      <g id="PFX-lids" opacity="0"><ellipse cx="-16" cy="0" rx="12" ry="14" fill="#f0c49a" stroke="#1a1a2e" stroke-width="3" /><ellipse cx="16" cy="0" rx="12" ry="14" fill="#f0c49a" stroke="#1a1a2e" stroke-width="3" /></g>
      <path id="PFX-browL" d="M-28,-20 L-6,-18" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" />
      <path id="PFX-browR" d="M6,-18 L28,-20" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" />
      <path d="M-3,6 Q0,18 6,16" fill="none" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" />
      <path id="PFX-m-smile" d="M-16,28 Q0,40 16,28" fill="none" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" />
      <ellipse id="PFX-m-o" cx="0" cy="32" rx="9" ry="11" fill="#5a1a1a" stroke="#1a1a2e" stroke-width="4" opacity="0" />
      <path id="PFX-m-flat" d="M-12,32 L12,32" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" opacity="0" />
    </g></g>
  </g>
</g>
