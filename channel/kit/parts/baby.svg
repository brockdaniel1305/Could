<!-- Baby in a nappy and a plain red romper (no badge), front view. Origin = between the feet, ~190 tall at scale 1 (draw at the
     scene's px-per-metre: 0.5 m). Rig: PFX-body, PFX-armL/-armR (origin shoulder: raise/thumb up), PFX-legL/-legR, PFX-head,
     PFX-pupL/-pupR, PFX-m-smile (default) / PFX-m-o, PFX-dummy (pacifier, opacity 1), PFX-thumb (inside armR, opacity 0). -->
<g id="PFX">
  <ellipse cx="0" cy="4" rx="46" ry="8" fill="#000" opacity="0.22" />
  <g id="PFX-body">
    <g id="PFX-legL"><rect x="-26" y="-40" width="22" height="38" rx="11" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /><ellipse cx="-16" cy="-4" rx="15" ry="8" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /></g>
    <g id="PFX-legR"><rect x="4" y="-40" width="22" height="38" rx="11" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /><ellipse cx="16" cy="-4" rx="15" ry="8" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /></g>
    <path d="M-40,-60 Q-44,-30 -26,-30 L26,-30 Q44,-30 40,-60 Z" fill="#f4f4f2" stroke="#1a1a2e" stroke-width="4" />
    <path d="M-38,-110 Q-46,-64 -38,-56 L38,-56 Q46,-64 38,-110 Q0,-122 -38,-110 Z" fill="#d0202e" stroke="#1a1a2e" stroke-width="4" stroke-linejoin="round" />
    <circle cx="0" cy="-92" r="5" fill="#f4f4f2" /><circle cx="0" cy="-76" r="5" fill="#f4f4f2" />
    <g transform="translate(-40,-104)"><g id="PFX-armL"><rect x="-10" y="0" width="20" height="40" rx="10" fill="#d0202e" stroke="#1a1a2e" stroke-width="4" /><circle cx="0" cy="46" r="11" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /></g></g>
    <g transform="translate(40,-104)"><g id="PFX-armR"><rect x="-10" y="0" width="20" height="40" rx="10" fill="#d0202e" stroke="#1a1a2e" stroke-width="4" /><circle cx="0" cy="46" r="11" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" />
      <rect id="PFX-thumb" x="-4" y="52" width="9" height="18" rx="4" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="3" opacity="0" /></g></g>
    <g transform="translate(0,-152)"><g id="PFX-head">
      <circle cx="-48" cy="2" r="10" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" /><circle cx="48" cy="2" r="10" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" />
      <ellipse cx="0" cy="0" rx="48" ry="46" fill="#f2c9a0" stroke="#1a1a2e" stroke-width="4" />
      <path d="M-6,-46 Q0,-62 10,-50 Q4,-54 2,-44" fill="none" stroke="#7a5230" stroke-width="5" stroke-linecap="round" />
      <ellipse cx="-17" cy="-2" rx="10" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="3" /><ellipse cx="17" cy="-2" rx="10" ry="12" fill="#fff" stroke="#1a1a2e" stroke-width="3" />
      <circle id="PFX-pupL" cx="-16" cy="0" r="6" fill="#1a1a2e" /><circle id="PFX-pupR" cx="18" cy="0" r="6" fill="#1a1a2e" />
      <circle cx="-30" cy="18" r="8" fill="#f29a9a" opacity="0.6" /><circle cx="30" cy="18" r="8" fill="#f29a9a" opacity="0.6" />
      <path id="PFX-m-smile" d="M-12,22 Q0,32 12,22" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round" />
      <ellipse id="PFX-m-o" cx="0" cy="26" rx="7" ry="8" fill="#5a1a1a" stroke="#1a1a2e" stroke-width="3" opacity="0" />
      <g id="PFX-dummy"><ellipse cx="0" cy="28" rx="18" ry="10" fill="#4f7cff" stroke="#1a1a2e" stroke-width="3" /><circle cx="0" cy="36" r="7" fill="none" stroke="#4f7cff" stroke-width="4" /></g>
