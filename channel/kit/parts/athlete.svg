<!-- Athletic footballer, "broadcast" style (Season 2 style test): longer legs, broad shoulders, smaller head, small eyes, sharp brows,
     a real jawline - less cute than the classic rig. Origin = between the feet, ~360 tall.
     Placeholders: KITC (shirt), KIT2 (stripes, set STRIPEOP 0..1), SHORTC, SOCKC, NUMC, NUM, SKIN, HAIRSVG (inserted hair/beard markup).
     Rig (same ids as the classic parts): PFX, PFX-body, PFX-legL/-legR, PFX-armL/-armR (origin top), PFX-head, PFX-pupL/-pupR,
     PFX-m-smile / PFX-m-o, PFX-lids. -->
<g id="PFX">
  <g id="PFX-body">
    <g id="PFX-legL"><rect x="-27" y="-152" width="21" height="150" rx="9" fill="SKIN" stroke="#14141f" stroke-width="5" /><rect x="-29" y="-66" width="25" height="52" rx="5" fill="SOCKC" stroke="#14141f" stroke-width="4" /><path d="M-36,-2 Q-36,-16 -18,-16 Q-4,-16 -2,-6 L-2,0 L-36,0 Z" fill="#111" /></g>
    <g id="PFX-legR"><rect x="6" y="-152" width="21" height="150" rx="9" fill="SKIN" stroke="#14141f" stroke-width="5" /><rect x="4" y="-66" width="25" height="52" rx="5" fill="SOCKC" stroke="#14141f" stroke-width="4" /><path d="M36,-2 Q36,-16 18,-16 Q4,-16 2,-6 L2,0 L36,0 Z" fill="#111" /></g>
    <path d="M-38,-166 L38,-166 L40,-124 L4,-124 L0,-134 L-4,-124 L-40,-124 Z" fill="SHORTC" stroke="#14141f" stroke-width="5" stroke-linejoin="round" />
    <clipPath id="PFX-clip"><path d="M-50,-276 Q-56,-214 -38,-162 L38,-162 Q56,-214 50,-276 Q0,-290 -50,-276 Z" /></clipPath>
    <path d="M-50,-276 Q-56,-214 -38,-162 L38,-162 Q56,-214 50,-276 Q0,-290 -50,-276 Z" fill="KITC" />
    <g clip-path="url(#PFX-clip)" fill="KIT2" opacity="STRIPEOP"><rect x="-56" y="-300" width="18" height="150" /><rect x="-20" y="-300" width="18" height="150" /><rect x="16" y="-300" width="18" height="150" /></g>
    <path d="M-50,-276 Q-56,-214 -38,-162 L38,-162 Q56,-214 50,-276 Q0,-290 -50,-276 Z" fill="none" stroke="#14141f" stroke-width="5" stroke-linejoin="round" />
    <path d="M-34,-250 Q-10,-238 -6,-200 M34,-250 Q10,-238 6,-200" fill="none" stroke="#14141f" stroke-width="2.5" opacity="0.35" />
    <path d="M-16,-282 L0,-266 L16,-282" fill="none" stroke="#14141f" stroke-width="5" stroke-linecap="round" />
    <text id="PFX-num" data-layout-ignore x="0" y="-206" text-anchor="middle" font-family="Inter" font-weight="900" font-size="42" fill="NUMC" stroke="#14141f" stroke-width="2">NUM</text>
    <g transform="translate(-54,-272)"><g id="PFX-armL"><rect x="-9" y="0" width="19" height="104" rx="9" fill="SKIN" stroke="#14141f" stroke-width="5" /><rect x="-11" y="-2" width="23" height="34" rx="8" fill="KITC" stroke="#14141f" stroke-width="5" /><circle cx="0" cy="110" r="11" fill="SKIN" stroke="#14141f" stroke-width="5" /></g></g>
    <g transform="translate(54,-272)"><g id="PFX-armR"><rect x="-10" y="0" width="19" height="104" rx="9" fill="SKIN" stroke="#14141f" stroke-width="5" /><rect x="-12" y="-2" width="23" height="34" rx="8" fill="KITC" stroke="#14141f" stroke-width="5" /><circle cx="0" cy="110" r="11" fill="SKIN" stroke="#14141f" stroke-width="5" /></g></g>
    <rect x="-10" y="-298" width="20" height="20" fill="SKIN" stroke="#14141f" stroke-width="4" />
    <g transform="translate(0,-322)"><g id="PFX-head">
      <circle cx="-29" cy="0" r="7" fill="SKIN" stroke="#14141f" stroke-width="4" />
      <circle cx="29" cy="0" r="7" fill="SKIN" stroke="#14141f" stroke-width="4" />
      <path d="M-29,-20 Q-31,18 -14,32 Q0,40 14,32 Q31,18 29,-20 Q0,-40 -29,-20 Z" fill="SKIN" stroke="#14141f" stroke-width="5" stroke-linejoin="round" />
      <path d="M-14,30 Q0,36 14,30" fill="none" stroke="#14141f" stroke-width="2" opacity="0.4" />
