    <div class="card red" id="s3-neuer-c-z" data-layout-allow-overflow data-layout-allow-overlap style="left: 160px; top: 420px;"><div class="ck">ICEBERGS STOPPED</div><div class="cv">0</div></div>
    <div class="dip" id="s3-neuer-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const S = "#s3-neuer-";
      const D = 17.637;
      const C = {"name": 1.085, "h": 2.313, "wc": 5.345, "out": 7.215, "ice": 12.117, "zero": 15.507};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s3-neuer-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s3-neuer"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      fly("b", C.name, C.wc - 0.1);
      fly("wc", C.wc, C.out, { from: "right" });
      fly("hab", C.out + 0.4, C.ice - 0.1);
      fly("sv", C.ice, C.zero - 0.1, { from: "right" });
      fly("z", C.zero + 0.9, null, { from: "top", rot: 3 });
      // idle in goal: ready stance, blinking
      tl.fromTo(S + "k-armL", { rotation: 25 }, { rotation: 40, duration: 0.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(S + "k-armR", { rotation: -25 }, { rotation: -40, duration: 0.55, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.1);
      blink(S + "k-lids", 1.4); blink(S + "k-lids", 3.6);
      // height ruler grows next to him
      tl.fromTo(S + "ruler", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "expo.out" }, C.h);
      tl.to(S + "ruler", { opacity: 0, duration: 0.25 }, C.wc);
      // world champion: cup + arms up
      pop(S + "cup", C.wc + 0.3);
      tl.to(S + "k-armL", { rotation: 160, duration: 0.35, ease: "back.out(2)" }, C.wc + 0.3);
      tl.to(S + "k-armR", { rotation: -160, duration: 0.35, ease: "back.out(2)" }, C.wc + 0.38);
      tl.to(S + "cup", { opacity: 0, duration: 0.2 }, C.out);
      // leaves his goal for no reason: sprint right, the goal stays empty
      const run0 = C.out + 0.4, run1 = run0 + 1.6;
      tl.to([S + "k-armL", S + "k-armR"], { rotation: 0, duration: 0.2 }, C.out);
      tl.fromTo(S + "kwrap", { x: 0, rotation: 0 }, { x: 540, rotation: 8, duration: run1 - run0, ease: "power2.inOut" }, run0);
      tl.to(S + "kwrap", { rotation: 0, duration: 0.3, ease: "back.out(2)" }, run1);
      tl.fromTo(S + "k-legL", { rotation: -30 }, { rotation: 30, duration: 0.16, ease: "sine.inOut", repeat: 9, yoyo: true }, run0);
      tl.fromTo(S + "k-legR", { rotation: 30 }, { rotation: -30, duration: 0.16, ease: "sine.inOut", repeat: 9, yoyo: true }, run0);
      tl.fromTo(S + "k-armL", { rotation: 40 }, { rotation: -40, duration: 0.16, ease: "sine.inOut", repeat: 9, yoyo: true }, run0);
      tl.fromTo(S + "k-armR", { rotation: -40 }, { rotation: 40, duration: 0.16, ease: "sine.inOut", repeat: 9, yoyo: true }, run0);
      tl.set([S + "k-legL", S + "k-legR", S + "k-armL", S + "k-armR"], { rotation: 0 }, run1 + 0.02);
      swap(S + "k-m-smile", S + "k-m-o", run0); swap(S + "k-m-o", S + "k-m-smile", run1);
      pop(S + "q", run1 + 0.5);
      tl.to(S + "k-armL", { rotation: 30, duration: 0.3 }, run1 + 0.3);
      tl.to(S + "k-armR", { rotation: -30, duration: 0.3 }, run1 + 0.3);
      // stops fast-moving objects: three balls, three saves (glove at x ~ 870)
      [0, 1, 2].forEach((i) => {
        const at = C.ice + 0.4 + i * 0.9;
        tl.fromTo(S + "b" + (i + 1), { x: 0, rotation: 0 }, { x: -270, rotation: -540, duration: 0.45, ease: "power2.in" }, at);
        tl.to(S + "k-armR", { rotation: -120 + i * 25, duration: 0.15, ease: "power3.out" }, at + 0.3);
        tl.to(S + "b" + (i + 1), { x: -200, y: 300, duration: 0.5, ease: "power2.in" }, at + 0.46);
        tl.to(S + "k-armR", { rotation: -30, duration: 0.3 }, at + 0.6);
      });
      // none of them were icebergs
      tl.fromTo(S + "miniice", { x: 0 }, { x: -270, duration: 0.9, ease: "power3.out" }, C.zero);
      tl.to([S + "k-pupL", S + "k-pupR"], { x: 6, y: 5, duration: 0.25 }, C.zero + 0.6);
      tl.to(S + "k-browL", { y: -8, duration: 0.25 }, C.zero + 0.7);
      swap(S + "k-m-smile", S + "k-m-flat", C.zero + 0.7);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s3-neuer"] = tl;
    })();
  </script>
</template>
