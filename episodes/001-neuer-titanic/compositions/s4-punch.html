    (function () {
      const S = "#s4-punch-";
      const D = 15.002;
      const C = {"t": 0.842, "ball": 1.742, "berg": 4.441, "ratio": 8.662, "busy": 12.227};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s4-punch-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s4-punch"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('[id$="-head"]').forEach((el) => { if (el.tagName === "g") gsap.set(el, { transformOrigin: "50% 100%" }); });
      // helpers
      const show = (sel, at, d = 0.35) => tl.fromTo(sel, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: d, ease: "expo.out" }, at);
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        const n = Math.max(1, Math.floor(D / 2));
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: n - 1 }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: Math.floor(D / 1.4) }, 0);
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: Math.floor(D / 1.6) }, i * 0.35));
      };

      waves(S + "sea-waves1", S + "front-waves2");
      puffs(S + "tit");
      tl.fromTo(S + "head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.t);
      show(S + "r1", C.ball); show(S + "r2", C.berg); show(S + "r3", C.ratio);
      tl.fromTo(S + "ship", { rotation: -0.5, svgOrigin: "325 0" }, { rotation: 0.5, duration: 1.8, ease: "sine.inOut", repeat: Math.floor(D / 1.8), yoyo: true }, 0);
      // keeper on the bow, ready
      tl.fromTo(S + "k-armL", { rotation: 30 }, { rotation: 45, duration: 0.4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(S + "k-armR", { rotation: -30 }, { rotation: -45, duration: 0.45, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      pop(S + "ballcard", C.ball);
      tl.to(S + "ballcard", { opacity: 0, duration: 0.2 }, C.berg - 0.1);
      // the iceberg looms, far too big
      tl.fromTo(S + "icewrap", { x: 520 }, { x: 0, duration: 1.4, ease: "power2.out" }, C.berg);
      tl.to([S + "k-pupL", S + "k-pupR"], { x: 5, y: -5, duration: 0.3 }, C.berg + 0.6);
      swap(S + "k-m-smile", S + "k-m-o", C.berg + 0.7);
      pop(S + "icecard", C.berg + 1.6);
