  <script>
    (function () {
      const S = "#s6-bucket-";
      const D = 15.479;
      const C = {"t": 0.762, "in": 1.62, "scoop": 6.091, "rate": 8.786, "pump": 10.562, "is": 13.941};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s6-bucket-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s6-bucket"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      fly("b", C.t, C.in + 1.4);
      fly("in", C.in + 0.3, C.scoop - 0.1, { from: "right" });
      fly("sc", C.scoop, C.rate - 0.1);
      fly("nd", C.rate, C.is - 0.1, { from: "right" });
      fly("tag", C.is + 0.45, null, { from: "top", rot: 4 });
      // water rises the whole time, whatever he does
      tl.fromTo([S + "water", S + "wfront"], { y: 1500 }, { y: 1085, duration: D, ease: "power1.in" }, 0);
      tl.fromTo(S + "jet", { scaleX: 0.96, transformOrigin: "100% 0%" }, { scaleX: 1.04, duration: 0.12, ease: "none", repeat: R(D, 0.12), yoyo: true }, 0);
      tl.fromTo(S + "water path", { x: 0 }, { x: -120, duration: 1.2, ease: "none", repeat: R(D, 1.2) }, 0);
      // worried look at the hole
      tl.to([S + "k-pupL", S + "k-pupR"], { x: 6, duration: 0.3 }, C.in + 0.2);
      swap(S + "k-m-smile", S + "k-m-o", C.in + 0.4);
      // scooping: one arm swing per scoop, drops fly out to the left
      const scoop = (at, dur) => {
        tl.fromTo(S + "k-armL", { rotation: 20 }, { rotation: 170, duration: dur, ease: "power2.out" }, at);
        tl.fromTo(S + "k-armR", { rotation: -20 }, { rotation: -170, duration: dur, ease: "power2.out" }, at);
        tl.fromTo(S + "drops circle", { x: 0, y: 0, opacity: 1 }, { x: (i) => -360 - i * 50, y: (i) => -120 + i * 40, opacity: 0, duration: dur * 2, ease: "power1.out", stagger: dur * 0.15 }, at + dur * 0.6);
      };
      [0, 1, 2, 3].forEach((i) => scoop(C.scoop + i * 0.7, 0.35));
      // 3,300 per second: a blur of gloves
      const fast = C.rate + 0.2, stop = C.pump;
      tl.fromTo(S + "k-armL", { rotation: 30 }, { rotation: 170, duration: 0.05, ease: "none", repeat: R(stop - fast, 0.05), yoyo: true }, fast);
      tl.fromTo(S + "k-armR", { rotation: -30 }, { rotation: -170, duration: 0.05, ease: "none", repeat: R(stop - fast, 0.05), yoyo: true }, fast);
      tl.fromTo(S + "kwrap", { x: -4 }, { x: 4, duration: 0.05, repeat: R(stop - fast, 0.05), yoyo: true }, fast);
      // he is not a goalkeeper ... he is a pump
      tl.set([S + "k-armL", S + "k-armR", S + "kwrap"], { rotation: 0, x: 0 }, stop + 0.01);
      tl.to(S + "k-armL", { rotation: 20, duration: 0.3 }, stop + 0.05);
      tl.to(S + "k-armR", { rotation: -20, duration: 0.3 }, stop + 0.05);
      tl.to([S + "k-pupL", S + "k-pupR"], { x: 0, y: 0, duration: 0.3 }, stop + 0.2);
      swap(S + "k-m-o", S + "k-m-flat", stop + 0.3);
      tl.to(S + "k-lids", { opacity: 1, duration: 0.01 }, stop + 1.2);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s6-bucket"] = tl;
    })();
  </script>
