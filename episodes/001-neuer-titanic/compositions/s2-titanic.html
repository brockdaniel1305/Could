  <script>
    (function () {
      const S = "#s2-titanic-";
      const D = 14.273;
      const C = {"name": 0.987, "tons": 2.532, "uns": 6.265, "date": 8.775, "won": 12.014};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s2-titanic-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s2-titanic"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('[id$="-head"]').forEach((el) => { if (el.tagName === "g") gsap.set(el, { transformOrigin: "50% 100%" }); });
      // helpers
      const show = (sel, at, d = 0.35) => tl.fromTo(sel, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: d, ease: "expo.out" }, at);
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        const n = Math.max(1, Math.floor(D / 2));
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: n - 1 }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: Math.floor(D / 1.4) }, 0);
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: Math.floor(D / 1.6) }, i * 0.35));
      };

      waves(S + "sea-waves1", S + "front-waves2");
      puffs(S + "tit");
      // proud sailing
      tl.fromTo(S + "ship", { x: -40, rotation: -0.6, svgOrigin: "325 0" }, { x: 20, rotation: 0.6, duration: C.date + 1.6, ease: "sine.inOut" }, 0);
      tl.fromTo(S + "flag", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, C.uns);
      tl.fromTo(S + "flag", { skewY: 0 }, { skewY: 6, duration: 0.5, ease: "sine.inOut", repeat: 7, yoyo: true }, C.uns + 0.5);
      // day turns to night: 14 April 1912
      tl.fromTo([S + "day", S + "sun"], { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, C.date);
      tl.fromTo(S + "sun", { y: 0 }, { y: 220, duration: 0.6, ease: "power2.in" }, C.date);
      // the iceberg slides in and meets the bow
      const hit = C.won - 1.1;
      tl.fromTo(S + "icewrap", { x: 460 }, { x: -30, duration: hit - C.date - 0.2, ease: "power1.inOut" }, C.date + 0.2);
      tl.fromTo(S + "bonk", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, hit);
      tl.to(S + "bonk", { opacity: 0, duration: 0.2 }, hit + 0.8);
      tl.to(S + "ship", { rotation: -3, x: 6, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3 }, hit);
      // the iceberg won
      swap(S + "ice-smirk", S + "ice-grin", C.won);
      tl.to([S + "ice-browL", S + "ice-browR"], { y: -12, duration: 0.25, ease: "back.out(3)" }, C.won);
      tl.to(S + "ship", { rotation: 4, duration: 1.2, ease: "power2.in" }, C.won + 0.3);
      tl.fromTo(S + "score", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, C.won + 0.3);
      // facts
      tl.fromTo(S + "head", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, C.name);
      show(S + "r1", C.tons); show(S + "r2", C.uns); show(S + "r3", C.date);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s2-titanic"] = tl;
    })();
  </script>
