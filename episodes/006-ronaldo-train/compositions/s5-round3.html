    (function () {
      const S = "#s5-round3-";
      const D = 22.23;
      const C = {"name": 1.665, "scale": 2.735, "h": 3.708, "v": 5.944, "real": 8.983, "has": 11.476, "go": 13.82, "jump": 15.86, "clear": 17.19, "score": 18.643};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s5-round3-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s5-round3"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);

        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      // departures board text as a pure function of scene time: steps = [[t, text], ...]
      const board = (steps) => {
        const el = document.querySelector(S + "st-boardt");
        tl.to({}, { duration: D, ease: "none", onUpdate() {
          const t = this.time(); let txt = steps[0][1];
          for (const [at, s] of steps) if (t >= at) txt = s;
          if (el.textContent !== txt) el.textContent = txt;
        } }, 0);
      };
      // jump (feet ~0.7 m = 84 px), spin in the air, land arms down-out: SIUUU
      const jump = (at, h = 84, air = 0.75) => {
        tl.to(S + "kwrap", { y: 12, duration: 0.14, ease: "power2.in" }, at - 0.14);
        tl.to(S + "kwrap", { y: -h, duration: air / 2, ease: "power2.out" }, at);
        tl.to(S + "kwrap", { y: 0, duration: air / 2, ease: "power2.in" }, at + air / 2);
      };
      const siu = (at) => {
        jump(at);
        tl.to(S + "kwrap", { scaleX: -1, transformOrigin: "50% 100%", duration: 0.18, ease: "none", yoyo: true, repeat: 1 }, at + 0.02);
        tl.to(S + "r-num", { scaleX: -1, transformOrigin: "50% 50%", duration: 0.18, ease: "none", yoyo: true, repeat: 1 }, at + 0.02);
        tl.to(S + "r-armL", { rotation: 40, duration: 0.15 }, at + 0.75);
        tl.to(S + "r-armR", { rotation: -40, duration: 0.15 }, at + 0.75);
        tl.to(S + "r-legL", { rotation: 22, duration: 0.15 }, at + 0.75);
        tl.to(S + "r-legR", { rotation: -22, duration: 0.15 }, at + 0.75);
        tl.set(S + "r-m-smile", { opacity: 0 }, at + 0.75); tl.set(S + "r-m-o", { opacity: 1 }, at + 0.75);
      };

      // score bug: a pure function of time; the side that scores pops
      const score = (at, a, b, who) => {
        const ea = document.querySelector(S + "sa"), eb = document.querySelector(S + "sb"), a0 = ea.textContent, b0 = eb.textContent;
        tl.to({}, { duration: D, ease: "none", onUpdate() {
          const on = this.time() >= at; ea.textContent = on ? a : a0; eb.textContent = on ? b : b0;
        } }, 0);
        tl.fromTo(S + (who || "sa"), { scale: 1 }, { scale: 1.8, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo(S + "score", { rotation: 0 }, { rotation: -4, duration: 0.08, yoyo: true, repeat: 3 }, at);
      };
      const boardName = (txt) => { const n = document.querySelector(S + "st-boardn"); if (n) n.textContent = txt; };

      fly("b", C.name, C.h - 0.1);
      // the model whizzes past once at its real speed (1 m/s = 1200 px/s)
      tl.fromTo(S + "mt", { x: 50 }, { x: -1700, duration: 1.25, ease: "none" }, C.name + 0.3);
      fly("sc", C.scale, C.v - 0.1, { from: "right" });
      tl.fromTo(S + "h4", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.h);
      fly("h", C.h, C.real - 0.1);
      fly("v", C.v, C.has - 0.1, { from: "right" });
      fly("rl", C.real, C.go - 0.1);
      tl.fromTo(S + "j70", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.has);
      fly("hs", C.has, C.go - 0.1, { from: "right" });
      // position: the boots bounce on the spot, the train appears on the right
      tl.fromTo(S + "kwrap", { y: 0 }, { y: -26, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 5 }, C.go + 0.2);
      tl.to(S + "h4", { opacity: 0.5, duration: 0.2 }, C.go);
      // the jump, in slow motion (x0.5): 70 cm up, 1.4 s in the air; the train passes under at 700 px/s
      tl.fromTo(S + "slow", { opacity: 0 }, { opacity: 1, duration: 0.15 }, C.jump - 0.4);
      tl.to(S + "slow", { opacity: 0, duration: 0.15 }, C.clear + 0.6);
      tl.fromTo(S + "mt", { x: 50 }, { x: -1700, duration: 2.5, ease: "none" }, C.jump - 0.35);
      jump(C.jump + 0.1, 840, 1.4);
      swap(S + "mtt-smirk", S + "mtt-o", C.jump + 0.4);
      tl.fromTo(S + "gap", { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "expo.out" }, C.clear);
      fly("cl", C.clear + 0.1, C.score - 0.1, { from: "right" });
      // landed: SIUUU, 2 : 1
      tl.to([S + "gap", S + "j70", S + "h4"], { opacity: 0, duration: 0.2 }, C.score);
      tl.to(S + "legB", { x: 120, duration: 0.15, ease: "power2.out" }, C.score);
      tl.fromTo(S + "siu", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, C.score);
      score(C.score, 2, 1, "sa");

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s5-round3"] = tl;
    })();
  </script>
</template>
