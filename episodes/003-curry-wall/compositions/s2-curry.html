    <div class="banner" id="s2-curry-c-b" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 330px;"><div class="bk">ON OFFENCE</div><div class="bt">Stephen Curry</div></div>
    <div class="card " id="s2-curry-c-h" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 520px;"><div class="ck">HEIGHT</div><div class="cv">1.88 m</div></div>
    <div class="card gold" id="s2-curry-c-tp" data-layout-allow-overflow data-layout-allow-overlap style="left: 360px; top: 380px;"><div class="ck">THREE-POINTERS MADE</div><div class="cv"><span id="s2-curry-cnt">0</span></div></div>
    <div class="card " id="s2-curry-c-ar" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 380px;"><div class="ck">RELEASE ANGLE</div><div class="cv">~52°</div></div>

  <script>
    (function () {
      const S = "#s2-curry-";
      const D = 14.729;
      const C = {"name": 0.95, "h": 2.105, "rec": 4.149, "arc": 7.967, "walk": 11.699};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s2-curry-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s2-curry"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      const play = (id, P, at, slow = 1, tEnd = null) => {
        const el = document.querySelector(S + id), last = tEnd ?? P[P.length - 1][0];
        const pos = (t) => { let i = 1; while (i < P.length - 1 && P[i][0] < t) i++;
          const a = P[i - 1], b = P[i], k = Math.max(0, Math.min(1, (t - a[0]) / ((b[0] - a[0]) || 1)));
          return [a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; };
        const p0 = P[0];
        tl.fromTo(el, { x: p0[1], y: p0[2] }, { x: p0[1], y: p0[2], duration: 0.01 }, Math.max(0, at - 0.02));
        tl.to({}, { duration: last * slow, ease: "none", onUpdate() {
          const t = this.time() / slow, [x, y] = pos(t);
          gsap.set(el, { x, y, rotation: t * 540 });
        } }, at);
      };
      const trail = (name, n, times, at, slow = 1) => { for (let i = 0; i < n; i++) tl.fromTo(S + name + i, { opacity: 0 }, { opacity: 0.9, duration: 0.01 }, at + times[i] * slow); };

      const UP = [[0.0167,174.0,998.6],[0.0333,183.0,987.4],[0.05,192.0,976.5],[0.0667,201.1,965.9],[0.0833,210.1,955.5],[0.1,219.1,945.5],[0.1167,228.1,935.7],[0.1333,237.1,926.1],[0.15,246.1,916.9],[0.1667,255.2,907.9],[0.1833,264.2,899.2],[0.2,273.2,890.7],[0.2167,282.2,882.6],[0.2333,291.2,874.7],[0.25,300.2,867.0],[0.2667,309.3,859.7],[0.2833,318.3,852.6],[0.3,327.3,845.8],[0.3167,336.3,839.3],[0.3333,345.3,833.0],[0.35,354.3,827.0],[0.3667,363.4,821.3],[0.3833,372.4,815.9],[0.4,381.4,810.7],[0.4167,390.4,805.8],[0.4333,399.4,801.2],[0.45,408.4,796.8],[0.4667,417.5,792.7],[0.4833,426.5,788.9],[0.5,435.5,785.4],[0.5167,444.5,782.1],[0.5333,453.5,779.1],[0.55,462.5,776.4],[0.5667,471.6,774.0],[0.5833,480.6,771.8],[0.6,489.6,769.9]];
      tl.fromTo(S + "spot", { opacity: 0 }, { opacity: 0.6, duration: 0.4 }, C.name - 0.2);
      fly("b", C.name, C.rec - 0.1);
      fly("h", C.h, C.rec - 0.1, { from: "right" });
      fly("tp", C.rec, C.arc - 0.1, { from: "right" });
      // the counter runs to 4,000
      const cnt = document.getElementById("s2-curry-cnt"), k = { v: 0 };
      tl.fromTo(k, { v: 0 }, { v: 4000, duration: 1.6, ease: "power2.out", onUpdate() { cnt.textContent = Math.round(k.v).toLocaleString("en-US") + (k.v > 3999 ? "+" : ""); } }, C.rec + 0.5);
      // ball in hands, arms up: the release angle
      tl.set(S + "ball", { x: 165.0, y: 1010.0 }, 0);
      tl.fromTo(S + "p-armL", { rotation: 0 }, { rotation: 170, duration: 0.35, ease: "power2.out" }, C.arc - 0.4);
      tl.fromTo(S + "p-armR", { rotation: 0 }, { rotation: -170, duration: 0.35, ease: "power2.out" }, C.arc - 0.4);
      fly("ar", C.arc, C.walk - 0.1, { from: "right" });
      tl.fromTo(S + "prot", { opacity: 0, scale: 0.3, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, C.arc + 0.2);
      tl.to(S + "prot", { opacity: 0, duration: 0.25 }, C.walk - 0.1);
      // shoots, turns around before it lands
      play("ball", UP, C.walk + 0.2, 1);
      tl.to(S + "kwrap", { y: -30, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, C.walk + 0.1);
      tl.to(S + "kwrap", { scaleX: -1, transformOrigin: "50% 100%", duration: 0.2, ease: "power2.inOut" }, C.walk + 0.9);
      tl.to(S + "p-num", { scaleX: -1, transformOrigin: "50% 50%", duration: 0.2 }, C.walk + 0.9);
      tl.to([S + "p-armL", S + "p-armR"], { rotation: 0, duration: 0.3 }, C.walk + 0.9);
      swap(S + "p-m-smile", S + "p-m-o", C.walk + 1.4); swap(S + "p-m-o", S + "p-m-smile", C.walk + 1.8);
      tl.to(S + "p-lids", { opacity: 1, duration: 0.01 }, C.walk + 1.2);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s2-curry"] = tl;
    })();
  </script>
