</g></g></g><g transform="translate(150,1190)"><g id="s6-strike-b-ball"><g id="s6-strike-b-ball-spin"><g transform="scale(0.45)"><!-- Football. Origin = centre, r = 22. -->
<g id="s6-strike-b-ballf">
  <circle r="22" fill="#fff" stroke="#1a1a2e" stroke-width="4" />
  <path d="M0,-8 L8,-2 L5,8 L-5,8 L-8,-2 Z" fill="#1a1a2e" />
  <path d="M0,-8 L0,-21 M8,-2 L20,-6 M5,8 L12,18 M-5,8 L-12,18 M-8,-2 L-20,-6" stroke="#1a1a2e" stroke-width="3" />
</g>

      </g>
    </svg>
    <div class="logo" data-layout-ignore>COULD<b>?</b></div>
    <div class="live" data-layout-ignore><i></i>LIVE RECONSTRUCTION</div>
    <div class="banner" id="s6-strike-c-a" data-layout-allow-overflow data-layout-allow-overlap style="left: 30px; top: 330px;"><div class="bk">ROME STRIKES BACK</div><div class="bt">Plan A: the testudo</div></div>
    <div class="card gold" id="s6-strike-c-to" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 600px;"><div class="ck">A TORTOISE MADE OF</div><div class="cv">Shields</div></div>
    <div class="card red" id="s6-strike-c-lg" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 380px;"><div class="ck">LEGS UNDERNEATH</div><div class="cv">40</div></div>
    <div class="card gold" id="s6-strike-c-nt" data-layout-allow-overflow data-layout-allow-overlap style="left: 40px; top: 380px;"><div class="ck">PLAN A</div><div class="cv">Nutmegged</div></div>
    <div class="banner" id="s6-strike-c-b" data-layout-allow-overflow data-layout-allow-overlap style="left: 40px; top: 330px;"><div class="bk">PLAN B</div><div class="bt">Build a wall</div></div>
    <div class="card " id="s6-strike-c-hw" data-layout-allow-overflow data-layout-allow-overlap style="left: 40px; top: 380px;"><div class="ck">HADRIAN&#x27;S WALL</div><div class="cv">Built from AD 122</div></div>
    <div class="card red" id="s6-strike-c-km" data-layout-allow-overflow data-layout-allow-overlap style="left: 600px; top: 300px;"><div class="ck">LENGTH</div><div class="cv"><svg width="300" height="330" viewBox="0 0 300 330" style="border-radius: 12px; border: 4px solid #1a1a2e;"><rect width="300" height="330" fill="#7fb8d8" /><polygon points="41,326 275,282 275,227 227,202 205,165 171,125 155,106 136,95 164,51 101,48 120,15 63,15 44,62 38,99 57,128 66,154 107,150 117,172 126,191 76,209 88,246 54,264 85,279 41,326" fill="#9bb36b" stroke="#1a1a2e" stroke-width="3" /><path id="s6-strike-hwline" d="M118,148 L139,147 L158,147 L175,147" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" fill="none" stroke="#c0262d" stroke-width="9" stroke-linecap="round" /></svg>117 km</div></div>
    <div class="card gold" id="s6-strike-c-fk" data-layout-allow-overflow data-layout-allow-overlap style="left: 40px; top: 380px;"><div class="ck">MESSI FREE-KICK GOALS</div><div class="cv">65+</div></div>
    <div class="card red" id="s6-strike-c-lo" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 560px;"><div class="ck">THIS WALL</div><div class="cv">Just longer</div></div>
    <div class="score" id="s6-strike-score"><span class="sn">ROME</span><span class="sv" id="s6-strike-sa">0</span><span class="sc">:</span><span class="sv" id="s6-strike-sb">1</span><span class="sn">MESSI</span></div>

  </div>
  <script>
    (function () {
      const S = "#s6-strike-";
      const D = 20.99;
      const C = {"a": 1.403, "tort": 2.734, "legs": 4.535, "nut": 6.83, "b": 8.46, "wall": 10.46, "hw": 11.928, "km": 13.298, "fk": 15.06, "long": 18.86};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s6-strike-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s6-strike"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      const N = (s) => S + s;
      // text that is a pure function of time: steps = [[t, text], ...]
      const label = (id, steps) => {
        const el = document.querySelector(S + id);
        tl.to({}, { duration: D, ease: "none", onUpdate() {
          const t = this.time(); let txt = steps[0][1];
          for (const [at, s] of steps) if (t >= at) txt = s;
          if (el.textContent !== txt) el.textContent = txt;
        } }, 0);
      };
      // number that counts from a to b between t0 and t0+d (eased), formatted with thousands separators
      const count = (id, a, b, t0, d, ease = "power2.out", suffix = "") => {
        const el = document.querySelector(S + id), o = { v: a };
        el.textContent = a.toLocaleString("en-US") + suffix;
        tl.fromTo(o, { v: a }, { v: b, duration: d, ease, onUpdate() { el.textContent = Math.round(o.v).toLocaleString("en-US") + suffix; } }, t0);
      };
      const score = (at, a, b) => {
        const ea = document.querySelector(S + "sa"), eb = document.querySelector(S + "sb"), a0 = ea.textContent, b0 = eb.textContent;
        tl.to({}, { duration: D, ease: "none", onUpdate() { const on = this.time() >= at; ea.textContent = on ? a : a0; eb.textContent = on ? b : b0; } }, 0);
        tl.fromTo(S + "sb", { scale: 1 }, { scale: 1.8, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo(S + "score", { rotation: 0 }, { rotation: -4, duration: 0.08, yoyo: true, repeat: 3 }, at);
      };
      const showScore = (at) => tl.fromTo(S + "score", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, at);
      // a Roman (prefix p = "<name>p") stamps his foot
      const stompR = (name, at) => {
        tl.to(S + name, { y: -18, duration: 0.12, ease: "power2.out" }, at - 0.12);
        tl.to(S + name, { y: 0, duration: 0.1, ease: "power3.in" }, at);
      };
      const look = (p, x, y, at, d = 0.2) => tl.to([S + p + "-pupL", S + p + "-pupR"], { x, y, duration: d }, at);
      const face = (p, show, at) => {
        ["m-flat", "m-o", "m-wavy", "m-smile"].forEach((m) => { if (document.querySelector(S + p + "-" + m)) tl.set(S + p + "-" + m, { opacity: m === show ? 1 : 0 }, at); });
      };
      // a Roman spins on the spot and stays dizzy: swirl eyes, wavy mouth, orbiting stars, swaying
      const dizzy = (name, at, spins = 3) => {
        const p = name + "p";
        tl.to(S + name, { scaleX: -1, transformOrigin: "50% 100%", duration: 0.09, ease: "none", yoyo: true, repeat: spins * 2 - 1 }, at);
        tl.set(S + p + "-swirl", { opacity: 1 }, at + 0.2);
        face(p, "m-wavy", at + 0.2);
        tl.set(S + p + "-stars", { opacity: 1 }, at + spins * 0.18);
        const t1 = at + spins * 0.18, rest = Math.max(0.5, D - t1);
        tl.fromTo(S + p + "-rotor", { rotation: 0 }, { rotation: 360, transformOrigin: "50% 50%", duration: 0.9, ease: "none", repeat: R(rest, 0.9) }, t1);
        tl.fromTo(S + p + "-body", { rotation: -7 }, { rotation: 7, transformOrigin: "50% 100%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: R(rest, 0.45) }, t1);
      };
      // Messi running: legs and arms swing between t0 and t1
      const run = (t0, t1, cyc = 0.16) => {
        const n = R(t1 - t0, cyc);
        tl.fromTo(S + "m-legL", { rotation: -26 }, { rotation: 26, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-legR", { rotation: 26 }, { rotation: -26, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-armL", { rotation: 22 }, { rotation: -22, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-armR", { rotation: -22 }, { rotation: 22, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.to([S + "m-legL", S + "m-legR", S + "m-armL", S + "m-armR"], { rotation: 0, duration: 0.12 }, t1);
      };
      const kickR = (at) => {  // right leg swings back and through
        tl.to(S + "m-legR", { rotation: 35, duration: 0.1, ease: "power2.in" }, at - 0.12);
        tl.to(S + "m-legR", { rotation: -50, duration: 0.08, ease: "power3.out" }, at - 0.02);
        tl.to(S + "m-legR", { rotation: 0, duration: 0.1 }, at + 0.06);
      };
      // quadratic arc for an element whose parent sits at its start: offsets (dx, dy) to the end, apex height h
      const arc = (sel, t0, d, dx, dy, h, spinSel) => {
        const el = document.querySelector(sel), o = { p: 0 };
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "none", onUpdate() {
          const p = o.p, x = dx * p, y = dy * p - 4 * h * p * (1 - p);
          gsap.set(el, { x, y });
        } }, t0);
        if (spinSel) tl.fromTo(spinSel, { rotation: 0 }, { rotation: 720, duration: d, ease: "none", transformOrigin: "50% 50%" }, t0);
      };
      const drawOn = (sel, at, d = 0.6) => tl.fromTo(sel, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
      const stampIn = (at) => {
        tl.fromTo(S + "stamp", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, at);
        tl.fromTo(S + "svg", { x: 0 }, { x: 10, duration: 0.04, repeat: 5, yoyo: true }, at + 0.18);
      };

      const FK_RUN = 0.9, FK_KICK = 1.55, FL = 1.2, GX = 920;
      const SB = "#s6-strike-b-";

      // ---- Plan A: the testudo shuffles in
      fly("a", C.a, C.legs - 0.1, { from: "top" });
      tl.fromTo(S + "tw", { x: 0 }, { x: -700, duration: 3.4, ease: "power1.out" }, 0.3);
      tl.fromTo(S + "tw .tlA", { y: 0 }, { y: -12, duration: 0.14, yoyo: true, repeat: R(3.4, 0.14), ease: "sine.inOut" }, 0.3);
      tl.fromTo(S + "tw .tlB", { y: -12 }, { y: 0, duration: 0.14, yoyo: true, repeat: R(3.4, 0.14), ease: "sine.inOut" }, 0.3);
      tl.fromTo(S + "tw .tpup", { x: 0 }, { x: -3, duration: 0.3 }, 1.0);
      fly("to", C.tort, C.legs - 0.1, { from: "right" });
      look("m", 6, 0, 0.6);
      // ... unfortunately, it has legs: the camera drops to ground level
      tl.to(S + "zoom", { scale: 1.8, transformOrigin: "420px 1200px", duration: 0.7, ease: "power2.inOut" }, C.legs);
      fly("lg", C.legs + 0.5, C.nut - 0.1, { from: "right" });
      // nutmeg: the ball goes between the legs, Messi runs round the back
      kickR(C.nut);
      tl.to(S + "ball", { x: 900, duration: 0.8, ease: "power1.out" }, C.nut);
      tl.to(S + "ball-spin", { rotation: 900, duration: 0.8, ease: "power1.out" }, C.nut);
      run(C.nut + 0.1, C.nut + 0.9);
      tl.to(S + "mw", { x: 900, duration: 0.8, ease: "power1.in" }, C.nut + 0.1);
      tl.to(S + "tw .tpup", { x: 4, duration: 0.15 }, C.nut + 0.5);
      tl.to(S + "zoom", { scale: 1, duration: 0.5, ease: "power2.inOut" }, C.nut + 0.6);
      tl.to(S + "tw", { scaleX: -1, transformOrigin: "50% 100%", duration: 0.2 }, C.nut + 0.9);
      // the shell falls apart
      [1, 2, 3, 4, 5].forEach((i) => {
        tl.to(S + "t-r" + i, { y: -200 - i * 30, x: (i - 3) * 80, rotation: (i - 3) * 50, duration: 0.35, ease: "power2.out" }, C.nut + 1.1);
        tl.to(S + "t-r" + i, { y: 320, duration: 0.4, ease: "power2.in" }, C.nut + 1.45);
        tl.to(S + "t-s" + i, { rotation: (i % 2 ? 1 : -1) * 80, y: 60, x: (i - 3) * 40, transformOrigin: "50% 100%", duration: 0.4, ease: "power2.in" }, C.nut + 1.15 + i * 0.04);
      });
      fly("nt", C.nut + 0.3, C.b - 0.1);
      score(C.nut + 0.5, 0, 2);
      // ---- Plan B: wide shot (65 px/m)
      tl.set(S + "A", { opacity: 0 }, C.b);
      tl.set(S + "B", { opacity: 1 }, C.b);
      fly("b", C.b, C.hw - 0.1, { from: "top" });
      // they build a wall: it rises out of the ground, the ground shakes
      tl.fromTo(S + "wall", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.9, ease: "back.out(1.3)" }, C.wall);
      tl.fromTo(S + "B", { y: 0 }, { y: 6, duration: 0.05, yoyo: true, repeat: 15 }, C.wall);
      fly("hw", C.hw, C.fk - 0.1);
      fly("km", C.km, C.fk - 0.1, { from: "right" });
      drawOn(S + "hwline", C.km + 0.4, 0.9);
      // free kick: 9.15 m, run-up, curl over the wall into the goal
      fly("fk", C.fk, null);
      tl.fromTo(S + "dash", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.fk + 0.1);
      tl.to(SB + "mw", { x: -50, duration: 0.4 }, C.fk + 0.3);
      tl.to(SB + "mw", { x: -8, duration: FK_KICK - FK_RUN, ease: "power1.in" }, C.fk + FK_RUN);
      tl.fromTo(SB + "m-legR", { rotation: 30 }, { rotation: -30, duration: 0.12, yoyo: true, repeat: 3 }, C.fk + FK_RUN);
      tl.to(SB + "m-legR", { rotation: -55, duration: 0.1, ease: "power3.out" }, C.fk + FK_KICK - 0.05);
      tl.to(SB + "m-legR", { rotation: 0, duration: 0.3 }, C.fk + FK_KICK + 0.3);
      arc(SB + "ball", C.fk + FK_KICK, FL, GX, -63, 470, SB + "ball-spin");
      tl.fromTo(S + "trr", { attr: { width: 0 } }, { attr: { width: 1080 }, duration: FL, ease: "none" }, C.fk + FK_KICK);
      [0, 1, 2].forEach((i) => { look("w" + i + "p", -5, -4, C.fk + FK_KICK); look("w" + i + "p", 6, -2, C.fk + FK_KICK + 0.6); face("w" + i + "p", "m-o", C.fk + FK_KICK + 0.4); });
      const goalT = C.fk + FK_KICK + FL;
      tl.fromTo(S + "goal", { scaleX: 1 }, { scaleX: 1.25, transformOrigin: "0% 100%", duration: 0.12, yoyo: true, repeat: 1 }, goalT);
      score(goalT + 0.1, 0, 3);
      tl.to(SB + "m-armL", { rotation: 150, duration: 0.25 }, goalT + 0.2);
      tl.to(SB + "m-armR", { rotation: -150, duration: 0.25 }, goalT + 0.2);
      // this one is just longer
      fly("lo", C.long, null, { from: "right" });
      [0, 1, 2].forEach((i) => dizzy("w" + i, C.long + 0.3 + i * 0.15, 2));

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);

      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s6-strike"] = tl;
    })();
  </script>
</template>
