    <div class="card red" id="s2-rome-c-fb" data-layout-allow-overflow data-layout-allow-overlap style="left: 520px; top: 560px;"><div class="ck">DEFENDED A FOOTBALL</div><div class="cv">Never</div></div>
    <div class="score" id="s2-rome-score"><span class="sn">ROME</span><span class="sv" id="s2-rome-sa">0</span><span class="sc">:</span><span class="sv" id="s2-rome-sb">0</span><span class="sn">MESSI</span></div>
    </div>
    <div class="dip" id="s2-rome-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const S = "#s2-rome-";
      const D = 17.445;
      const C = {"name": 1.28, "area": 2.41, "army": 5.27, "sh": 7.61, "ar": 8.501, "sw": 9.17, "cent": 9.95, "conq": 11.43, "ball": 14.145};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s2-rome-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s2-rome"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      const N = (s) => S + s;
      // text that is a pure function of time: steps = [[t, text], ...]
      const label = (id, steps) => {
        const el = document.querySelector(S + id);
        tl.to({}, { duration: D, ease: "none", onUpdate() {
          const t = this.time(); let txt = steps[0][1];
          for (const [at, s] of steps) if (t >= at) txt = s;
          if (el.textContent !== txt) el.textContent = txt;
        } }, 0);
      };
      // number that counts from a to b between t0 and t0+d (eased), formatted with thousands separators
      const count = (id, a, b, t0, d, ease = "power2.out", suffix = "") => {
        const el = document.querySelector(S + id), o = { v: a };
        el.textContent = a.toLocaleString("en-US") + suffix;
        tl.fromTo(o, { v: a }, { v: b, duration: d, ease, onUpdate() { el.textContent = Math.round(o.v).toLocaleString("en-US") + suffix; } }, t0);
      };
      const score = (at, a, b) => {
        const ea = document.querySelector(S + "sa"), eb = document.querySelector(S + "sb"), a0 = ea.textContent, b0 = eb.textContent;
        tl.to({}, { duration: D, ease: "none", onUpdate() { const on = this.time() >= at; ea.textContent = on ? a : a0; eb.textContent = on ? b : b0; } }, 0);
        tl.fromTo(S + "sb", { scale: 1 }, { scale: 1.8, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, at);
        tl.fromTo(S + "score", { rotation: 0 }, { rotation: -4, duration: 0.08, yoyo: true, repeat: 3 }, at);
      };
      const showScore = (at) => tl.fromTo(S + "score", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, at);
      // a Roman (prefix p = "<name>p") stamps his foot
      const stompR = (name, at) => {
        tl.to(S + name, { y: -18, duration: 0.12, ease: "power2.out" }, at - 0.12);
        tl.to(S + name, { y: 0, duration: 0.1, ease: "power3.in" }, at);
      };
      const look = (p, x, y, at, d = 0.2) => tl.to([S + p + "-pupL", S + p + "-pupR"], { x, y, duration: d }, at);
      const face = (p, show, at) => {
        ["m-flat", "m-o", "m-wavy", "m-smile"].forEach((m) => { if (document.querySelector(S + p + "-" + m)) tl.set(S + p + "-" + m, { opacity: m === show ? 1 : 0 }, at); });
      };
      // a Roman spins on the spot and stays dizzy: swirl eyes, wavy mouth, orbiting stars, swaying
      const dizzy = (name, at, spins = 3) => {
        const p = name + "p";
        tl.to(S + name, { scaleX: -1, transformOrigin: "50% 100%", duration: 0.09, ease: "none", yoyo: true, repeat: spins * 2 - 1 }, at);
        tl.set(S + p + "-swirl", { opacity: 1 }, at + 0.2);
        face(p, "m-wavy", at + 0.2);
        tl.set(S + p + "-stars", { opacity: 1 }, at + spins * 0.18);
        const t1 = at + spins * 0.18, rest = Math.max(0.5, D - t1);
        tl.fromTo(S + p + "-rotor", { rotation: 0 }, { rotation: 360, transformOrigin: "50% 50%", duration: 0.9, ease: "none", repeat: R(rest, 0.9) }, t1);
        tl.fromTo(S + p + "-body", { rotation: -7 }, { rotation: 7, transformOrigin: "50% 100%", duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: R(rest, 0.45) }, t1);
      };
      // Messi running: legs and arms swing between t0 and t1
      const run = (t0, t1, cyc = 0.16) => {
        const n = R(t1 - t0, cyc);
        tl.fromTo(S + "m-legL", { rotation: -26 }, { rotation: 26, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-legR", { rotation: 26 }, { rotation: -26, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-armL", { rotation: 22 }, { rotation: -22, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + "m-armR", { rotation: -22 }, { rotation: 22, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.to([S + "m-legL", S + "m-legR", S + "m-armL", S + "m-armR"], { rotation: 0, duration: 0.12 }, t1);
      };
      const kickR = (at) => {  // right leg swings back and through
        tl.to(S + "m-legR", { rotation: 35, duration: 0.1, ease: "power2.in" }, at - 0.12);
        tl.to(S + "m-legR", { rotation: -50, duration: 0.08, ease: "power3.out" }, at - 0.02);
        tl.to(S + "m-legR", { rotation: 0, duration: 0.1 }, at + 0.06);
      };
      // quadratic arc for an element whose parent sits at its start: offsets (dx, dy) to the end, apex height h
      const arc = (sel, t0, d, dx, dy, h, spinSel) => {
        const el = document.querySelector(sel), o = { p: 0 };
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "none", onUpdate() {
          const p = o.p, x = dx * p, y = dy * p - 4 * h * p * (1 - p);
          gsap.set(el, { x, y });
        } }, t0);
        if (spinSel) tl.fromTo(spinSel, { rotation: 0 }, { rotation: 720, duration: d, ease: "none", transformOrigin: "50% 50%" }, t0);
      };
      const drawOn = (sel, at, d = 0.6) => tl.fromTo(sel, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
      const stampIn = (at) => {
        tl.fromTo(S + "stamp", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, at);
        tl.fromTo(S + "svg", { x: 0 }, { x: 10, duration: 0.04, repeat: 5, yoyo: true }, at + 0.18);
      };

      const front = ["r1", "r2", "r3", "r4"];

      // slow camera pan along the legion
      tl.fromTo(S + "pan", { x: 0 }, { x: -110, duration: D, ease: "sine.inOut" }, 0);
      fly("b", C.name, C.area - 0.1);
      // the empire grows out of Rome
      fly("mp", C.area, C.army + 0.6);
      tl.fromTo(S + "mapclip", { attr: { r: 0 } }, { attr: { r: 520 }, duration: 2.2, ease: "power1.inOut" }, C.area + 0.4);
      fly("ar", C.army, C.cent - 0.1, { from: "right" });
      count("n", 0, 380000, C.army + 0.2, 1.6);
      // shields - armour - swords: all in sync
      fly("kit", C.sh, C.cent - 0.1);
      label("kitv", [[0, "Shields"], [C.ar, "Armour"], [C.sw, "Swords"]]);
      front.forEach((r) => stompR(r, C.sh + 0.05));
      front.forEach((r) => tl.fromTo(S + r + "p-shield", { x: 0 }, { x: 10, duration: 0.1, yoyo: true, repeat: 1 }, C.ar));
      front.forEach((r) => tl.fromTo(S + r + "p-body", { filter: "brightness(1)" }, { filter: "brightness(1.35)", duration: 0.12, yoyo: true, repeat: 1 }, C.ar));
      front.forEach((r) => { tl.to(S + r + "p-armR", { rotation: -165, duration: 0.18, ease: "back.out(2)" }, C.sw); tl.to(S + r + "p-armR", { rotation: 0, duration: 0.3 }, C.cent + 0.2); });
      front.forEach((r) => stompR(r, C.sw + 0.05));
      fly("ce", C.cent, C.conq - 0.1, { from: "right" });
      fly("cq", C.conq, C.ball - 0.1);
      // ... nobody ever asked them to defend a football: it rolls in, r2 looks down, prods it with his sword, it rolls away
      fly("fb", C.ball + 0.2, null, { from: "right" });
      tl.fromTo(S + "ball", { x: 0 }, { x: 460, duration: 0.8, ease: "power2.out" }, C.ball + 0.1);
      tl.fromTo(S + "ball-spin", { rotation: 0 }, { rotation: 540, duration: 0.8, ease: "power2.out", transformOrigin: "50% 50%" }, C.ball + 0.1);
      look("r2p", -4, 6, C.ball + 0.6);
      tl.to(S + "r2p-head", { rotation: -10, duration: 0.25 }, C.ball + 0.6);
      tl.to(S + "r2p-armR", { rotation: 55, duration: 0.2, ease: "power2.in" }, C.ball + 0.8);
      tl.to(S + "r2p-armR", { rotation: 0, duration: 0.3 }, C.ball + 1.1);
      tl.to(S + "ball", { x: -140, duration: 1.1, ease: "power2.out" }, C.ball + 1.0);
      tl.to(S + "ball-spin", { rotation: -200, duration: 1.1, ease: "power2.out" }, C.ball + 1.0);
      tl.to(S + "ball", { y: -50, duration: 0.2, yoyo: true, repeat: 1, ease: "power1.out" }, C.ball + 1.9);
      tl.to([S + "r2p-browL", S + "r2p-browR"], { y: -6, duration: 0.2 }, C.ball + 1.4);
      face("r2p", "m-o", C.ball + 1.4);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);

      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s2-rome"] = tl;
    })();
  </script>
</template>
