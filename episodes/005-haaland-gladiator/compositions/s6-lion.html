    <path d="M150,-10 Q230,-30 210,-100" fill="none" stroke="#1a1a2e" stroke-width="12" stroke-linecap="round" /><path d="M150,-10 Q230,-30 210,-100" fill="none" stroke="#d9a14a" stroke-width="6" stroke-linecap="round" />
    <path d="M-40,0 Q-60,-150 20,-200 Q120,-200 150,-60 Q160,0 120,0 Z" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" stroke-linejoin="round" />
    <rect x="-56" y="-90" width="34" height="92" rx="14" fill="#d9a14a" stroke="#1a1a2e" stroke-width="5" />
    <g transform="translate(-20,-230)"><circle cx="0" cy="0" r="78" fill="#8a5a24" stroke="#1a1a2e" stroke-width="5" /><circle cx="-14" cy="6" r="50" fill="#e0aa55" stroke="#1a1a2e" stroke-width="5" />
      <ellipse cx="-34" cy="-6" rx="9" ry="11" fill="#1a1a2e" /><ellipse cx="4" cy="-6" rx="9" ry="11" fill="#1a1a2e" />
      <path d="M-48,-30 L-24,-22 M-8,-22 L16,-30" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" />
      <path d="M-26,14 L-14,24 L-2,14 Z" fill="#5a2e1a" /><path d="M-30,36 L4,36" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round" /></g>
  </g>
  <g id="s6-lion-l-q" opacity="0" transform="translate(60,-370)"><circle r="40" fill="#fff" stroke="#1a1a2e" stroke-width="5" /><text y="18" text-anchor="middle" font-family="Inter" font-weight="900" font-size="54" fill="#1a1a2e">?</text></g>
</g>
</g></g></g>
      </g>
    </svg>
    <div class="logo" data-layout-ignore>COULD<b>?</b></div>
    <div class="live" data-layout-ignore><i></i>LIVE RECONSTRUCTION</div>
    <div class="banner" id="s6-lion-c-b" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 330px;"><div class="bk">ROUND 3</div><div class="bt">The Lion</div></div>
    <div class="card red" id="s6-lion-c-lv" data-layout-allow-overflow data-layout-allow-overlap style="left: 520px; top: 380px;"><div class="ck">LION SPRINT</div><div class="cv">up to 80 km/h</div></div>
    <div class="card " id="s6-lion-c-hv" data-layout-allow-overflow data-layout-allow-overlap style="left: 520px; top: 560px;"><div class="ck">HAALAND</div><div class="cv">~36 km/h</div></div>
    <div class="card " id="s6-lion-c-rn" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 380px;"><div class="ck">RUNNING AWAY</div><div class="cv">Not an option</div></div>
    <div class="card gold" id="s6-lion-c-md" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 380px;"><div class="ck">PLAN</div><div class="cv">Meditation</div></div>
    <div class="card gold" id="s6-lion-c-ls" data-layout-allow-overflow data-layout-allow-overlap style="left: 480px; top: 560px;"><div class="ck">LION</div><div class="cv">Also meditating</div></div>
    </div>
    <div class="dip" id="s6-lion-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const S = "#s6-lion-";
      const D = 13.67;
      const C = {"t": 1.03, "v": 1.67, "h": 4.71, "run": 6.31, "zen": 8.37, "lion": 10.41};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s6-lion-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s6-lion"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      // sit down cross-legged and float a little (Haaland's meditation celebration)
      // v2: the hips drop to the ground and the legs cross IN FRONT (shins overlap) instead of splaying out;
      // hands rest on the knees. s = Haaland's scale (leg length ~92 px at scale 1).
      const meditate = (at, s = 1.15) => {
        const sit = 92 * s;
        tl.to(S + "kwrap", { y: sit, duration: 0.35, ease: "power2.inOut" }, at);
        tl.to(S + "h-legL", { rotation: -84, duration: 0.35 }, at);
        tl.to(S + "h-legR", { rotation: 84, duration: 0.35 }, at);
        tl.to(S + "h-armL", { rotation: -28, duration: 0.35 }, at + 0.1);
        tl.to(S + "h-armR", { rotation: 28, duration: 0.35 }, at + 0.1);
        tl.to(S + "h-lids", { opacity: 1, duration: 0.01 }, at + 0.4);
        tl.fromTo(S + "kwrap", { y: sit }, { y: sit - 22, duration: 0.9, ease: "sine.inOut", repeat: R(D - at - 0.4, 0.9), yoyo: true }, at + 0.4);
      };
      // the crowd in the stands jumps (replaces the old mood gauge)
      const cheer = (at, n = 3) => tl.fromTo(S + "col-crowd", { y: 0 }, { y: -14, duration: 0.14, yoyo: true, repeat: n * 2 - 1, ease: "power1.out" }, at);

      fly("b", C.t, C.v - 0.1);
      // the lion comes out of the gate
      tl.fromTo(S + "lwrap", { x: 700 }, { x: 0, duration: 1.4, ease: "power2.out" }, C.t);
      tl.fromTo(S + "l-legF", { rotation: -25 }, { rotation: 25, duration: 0.14, repeat: 9, yoyo: true }, C.t);
      tl.fromTo(S + "l-legB", { rotation: 25 }, { rotation: -25, duration: 0.14, repeat: 9, yoyo: true }, C.t);
      tl.fromTo(S + "l-tail", { rotation: -8, svgOrigin: "130 -120" }, { rotation: 8, duration: 0.5, ease: "sine.inOut", repeat: R(D, 0.5), yoyo: true }, 0);
      fly("lv", C.v, C.run - 0.1, { from: "right" });
      fly("hv", C.h, C.run - 0.1, { from: "right" });
      tl.fromTo(S + "l-jaw", { y: 0 }, { y: 10, duration: 0.2, yoyo: true, repeat: 5 }, C.v + 0.4);
      swap(S + "h-m-smile", S + "h-m-o", C.v + 0.5);
      fly("rn", C.run, C.zen - 0.1);
      // so he sits down and meditates
      fly("md", C.zen, null);
      swap(S + "h-m-o", S + "h-m-smile", C.zen + 0.1);
      meditate(C.zen + 0.2);
      tl.to(S + "lwrap", { x: -160, duration: 0.8, ease: "power2.out" }, C.zen + 0.6);
      tl.fromTo(S + "l-q", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, C.zen + 1.3);
      // the lion, confused, sits down next to him
      tl.to(S + "l-q", { opacity: 0, duration: 0.2 }, C.lion + 0.2);
      tl.set(S + "l-stand", { opacity: 0 }, C.lion + 0.4); tl.set(S + "l-sit", { opacity: 1 }, C.lion + 0.4);
      fly("ls", C.lion + 0.5, null, { from: "right" });
      cheer(C.lion + 0.6);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);

      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s6-lion"] = tl;
    })();
  </script>
</template>
