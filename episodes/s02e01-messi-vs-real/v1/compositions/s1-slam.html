    </div>
    <div class="dip" id="s1-slam-dip" data-layout-ignore></div>
  </div>
  <script>
    (function () {
      const S = "#s1-slam-";
      const D = 3.025;
      const C = {};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s1-slam-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s1-slam"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      const label = (id, steps) => {
        const el = document.querySelector(S + id); if (!el) return;
        tl.to({}, { duration: D, ease: "none", onUpdate() { const t = this.time(); let txt = steps[0][1];
          for (const [at, s] of steps) if (t >= at) txt = s; if (el.textContent !== txt) el.textContent = txt; } }, 0);
      };
      const look = (p, x, y, at, d = 0.2) => tl.to([S + p + "-pupL", S + p + "-pupR"], { x, y, duration: d }, at);
      // crowd: idle bob, a Mexican wave, everyone jumps, flashbulbs
      const crowdIdle = () => { for (let j = 0; j < 24; j++) tl.fromTo(S + "fc" + j, { y: 0 }, { y: -5, duration: 0.3 + (j % 4) * 0.05, yoyo: true, repeat: R(D, 0.3 + (j % 4) * 0.05), ease: "sine.inOut" }, (j % 5) * 0.07);
        for (let i = 0; i < 4; i++) tl.fromTo(S + "flag" + i, { rotation: -6 }, { rotation: 6, transformOrigin: "0% 100%", duration: 0.5, yoyo: true, repeat: R(D, 0.5), ease: "sine.inOut" }, i * 0.1);
        tl.fromTo(S + "adtext", { x: 0 }, { x: -600, duration: D, ease: "none" }, 0); };
      const wave = (t0) => { for (let j = 0; j < 24; j++) tl.to(S + "fc" + j, { y: -34, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", overwrite: false }, t0 + j * 0.06); };
      const jump = (t0, n = 3) => tl.fromTo(S + "fans", { y: 0 }, { y: -22, duration: 0.15, yoyo: true, repeat: n * 2 - 1, ease: "power2.out" }, t0);
      const flashes = (t0, d) => { for (let i = 0; i < 20; i++) { const at = t0 + ((i * 0.37) % Math.max(0.4, d)); tl.set(S + "fl" + i, { opacity: 1 }, at); tl.set(S + "fl" + i, { opacity: 0 }, at + 0.08); } };
      const score = (h, a, m, at) => { label("hs", [[0, document.querySelector(S + "hs").textContent], [at, String(h)]]); label("as", [[0, document.querySelector(S + "as").textContent], [at, String(a)]]);
        label("min", [[0, document.querySelector(S + "min").textContent], [at, m]]); tl.fromTo(S + "hud", { scale: 1 }, { scale: 1.12, transformOrigin: "50% 50%", duration: 0.15, yoyo: true, repeat: 1 }, at); };
      const stamina = (pct, at = 0, d = 0.01) => tl.to(S + "stam", { width: pct + "%", backgroundColor: pct < 25 ? "#e0412f" : pct < 55 ? "#ffd23f" : "#1f9d55", duration: d }, at);
      const slamIn = (name, at, out) => { tl.fromTo(S + name, { opacity: 0, scale: 2.2, rotation: -4 }, { opacity: 1, scale: 1, rotation: -3, transformOrigin: "50% 50%", duration: 0.2, ease: "power4.in" }, at);
        tl.fromTo(S + "svg", { x: 0 }, { x: 12, duration: 0.04, yoyo: true, repeat: 5 }, at + 0.2); if (out != null) tl.to(S + name, { opacity: 0, scale: 0.8, duration: 0.15 }, out); };
      const confettiFall = (at) => { tl.set(S + "conf", { opacity: 1 }, at); tl.fromTo(S + "conf", { y: 0 }, { y: 2300, duration: 2.6, ease: "none" }, at); };
      const run = (p, t0, t1, cyc = 0.14) => { const n = R(t1 - t0, cyc);
        tl.fromTo(S + p + "-legL", { rotation: -28 }, { rotation: 28, duration: cyc, yoyo: true, repeat: n, ease: "sine.inOut" }, t0);
        tl.fromTo(S + p + "-legR", { rotation: 28 }, { rotation: -28, duration: cyc, yoyo: true, repeat: n, ease: "sine.inOut" }, t0);
        tl.to([S + p + "-legL", S + p + "-legR"], { rotation: 0, duration: 0.1 }, t1); };
      const arc = (sel, t0, d, dx, dy, h, spinSel) => { const el = document.querySelector(sel), o = { p: 0 };
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "none", onUpdate() { const p = o.p; gsap.set(el, { x: dx * p, y: dy * p - 4 * h * p * (1 - p) }); } }, t0);
        if (spinSel) tl.fromTo(spinSel, { rotation: 0 }, { rotation: 720, duration: d, ease: "none", transformOrigin: "50% 50%" }, t0); };
      const spinOut = (name, at) => { tl.to(S + name, { scaleX: -1, transformOrigin: "50% 100%", duration: 0.08, yoyo: true, repeat: 3, ease: "none" }, at);
        tl.to(S + name, { rotation: 80, transformOrigin: "50% 100%", duration: 0.35, ease: "power2.in" }, at + 0.35); };

      // close-up juggling: the ball bounces between Messi's foot and knee
      const juggle = (pre, t0, d) => { tl.fromTo(S + pre + "b", { y: 0 }, { y: -110, duration: 0.28, ease: "power2.out", yoyo: true, repeat: R(d, 0.28) }, t0);
        tl.fromTo(S + pre + "b-spin", { rotation: 0 }, { rotation: 360, duration: 0.56, ease: "none", repeat: R(d, 0.56), transformOrigin: "50% 50%" }, t0);
        tl.fromTo(S + pre + "m-legR", { rotation: 0 }, { rotation: -30, duration: 0.28, ease: "power2.in", yoyo: true, repeat: R(d, 0.28) }, t0); };

      juggle("cu", 0, 0.85);
      // frame 0: the first slam is already there (pulses in)
      tl.fromTo(S + "s1", { opacity: 1, scale: 1.12, rotation: -3, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 0);
      tl.set(S + "s1", { opacity: 0 }, 0.85);
      // hard cut to the line-up: 11 white shirts, Messi alone in front
      tl.set(S + "cu", { opacity: 0 }, 0.85); tl.set(S + "wide", { opacity: 1 }, 0.85);
      slamIn("s2", 0.85, null);
      flashes(0, D);
      for (let j = 0; j < 24; j++) tl.fromTo(S + "w-fc" + j, { y: 0 }, { y: -6, duration: 0.3, yoyo: true, repeat: R(D, 0.3) }, (j % 5) * 0.06);
      tl.fromTo(S + "w-zoom", { scale: 1.08, svgOrigin: "540 1200" }, { scale: 1, duration: 2.0, ease: "power2.out" }, 0.85);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);

      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s1-slam"] = tl;
    })();
  </script>
</template>
