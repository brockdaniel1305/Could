  <script>
    (function () {
      const S = "#s4-start-";
      const D = 18.68;
      const C = {"t": 1.567, "gun": 2.96, "react": 4.06, "rex": 6.479, "roar": 10.33, "lead": 11.905, "ahead": 15.49};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s4-start-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s4-start"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      // ---- race driver: everything below is a pure function of scene time ----
      const PX = 75, NOSE = 405;
      const SPL = [[0,0],[1.89,10],[2.88,20],[3.78,30],[4.64,40],[5.47,50],[6.29,60],[7.10,70],[7.92,80],[8.75,90],[9.58,100]];
      const boltM = (t) => {
        if (t <= 0) return 0;
        if (t >= 9.58) { const d = Math.min(t - 9.58, 2); return 100 + 10.4 * d - 2.6 * d * d; }
        for (let i = 1; i < SPL.length; i++) if (t <= SPL[i][0]) { const [t0, m0] = SPL[i - 1], [t1, m1] = SPL[i]; return m0 + (m1 - m0) * (t - t0) / (t1 - t0); }
      };
      const rexM = (t) => 12 + 5.4 * Math.max(0, t);
      const lerpK = (k, x) => {
        if (x <= k[0][0]) return k[0][1];
        for (let i = 1; i < k.length; i++) if (x <= k[i][0]) return k[i - 1][1] + (k[i][1] - k[i - 1][1]) * (x - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
        return k[k.length - 1][1];
      };
      const KEYS = [[0, 0], [2.96, 0], [4.06, 0.146], [10.33, 1.0], [18.68, 3.0]], CAMS = [[0, 5.5], [4.06, 'mid']];
      const target = (mode, b, r) => typeof mode === "number" ? mode : mode === "bolt" ? b + 1.5 : mode === "rex" ? r - 5 : (b + r - 5) / 2;
      const ss = (x) => x * x * (3 - 2 * x);
      const camAt = (lt, b, r) => {
        let i = 0; while (i + 1 < CAMS.length && lt >= CAMS[i + 1][0]) i++;
        const cur = target(CAMS[i][1], b, r);
        if (i === 0) return cur;
        const k = Math.min(1, (lt - CAMS[i][0]) / 0.7);
        return target(CAMS[i - 1][1], b, r) + (cur - target(CAMS[i - 1][1], b, r)) * ss(k);
      };
      const bolt = document.querySelector(S + "bolt"), rex = document.querySelector(S + "rex"), course = document.querySelector(S + "course");
      const clock = document.querySelector(S + "clock");
      const RIG = (p) => document.querySelector(S + p);
      const legsB = [RIG("b-legL"), RIG("b-legR"), RIG("b-armL"), RIG("b-armR")], legsR = [RIG("r-legL"), RIG("r-legR")];
      const race = { rt: 0 };
      tl.to({}, { duration: D, ease: "none", onUpdate() {
        const lt = this.time(), rt = lerpK(KEYS, lt), moving = lerpK(KEYS, lt + 0.05) > rt + 1e-4;
        race.rt = rt;
        const b = boltM(rt), r = rexM(rt);
        gsap.set(bolt, { x: b * PX });
        gsap.set(rex, { x: r * PX - NOSE });
        gsap.set(course, { x: 540 - camAt(lt, b, r) * PX });
        if (clock) clock.textContent = rt.toFixed(2) + " s";
        const tb = document.querySelector(S + "tb"), tr = document.querySelector(S + "tr");
        if (tb) { gsap.set(tb, { x: Math.min(b, 100) * 9 }); gsap.set(tr, { x: Math.min(r, 100) * 9 }); }
        if (moving && rt > 0.15 && boltM(rt) < 110.3) {
          const a = Math.sin(rt * Math.PI * 2 * 2.2) * 38;
          gsap.set(legsB[0], { rotation: a }); gsap.set(legsB[1], { rotation: -a });
          gsap.set(legsB[2], { rotation: -a * 1.2 }); gsap.set(legsB[3], { rotation: a * 1.2 });
          gsap.set(RIG("b-body"), { rotation: 7, transformOrigin: "50% 100%" });
        }
        if (moving) {
          const q = Math.sin(rt * Math.PI * 2 * 1.4) * 24;
          gsap.set(legsR[0], { rotation: q }); gsap.set(legsR[1], { rotation: -q });
          gsap.set(RIG("r-body"), { y: Math.abs(Math.sin(rt * Math.PI * 2 * 1.4)) * -10 });
        }
      } }, 0);

      fly("b", C.t, C.react - 0.1);
      fly("clk", C.gun - 0.6, null, { from: "right" });
      fly("re", C.react, C.rex - 0.1);
      fly("hs", C.lead, C.ahead - 0.1);
      fly("ld", C.ahead, null, { from: "top" });
      // set ... BANG
      tl.fromTo(S + "bang", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.2, ease: "back.out(3)" }, C.gun);
      tl.to(S + "bang", { opacity: 0, duration: 0.2 }, C.gun + 0.8);
      tl.to(S + "b-armL", { rotation: 30, duration: 0.3 }, 0.6);
      tl.to(S + "b-armR", { rotation: -30, duration: 0.3 }, 0.6);
      swap(S + "b-m-smile", S + "b-m-flat", C.t);
      // the T-Rex takes the pistol personally: head turns, ROAR
      tl.to(S + "r-pup", { x: 6, y: -4, duration: 0.2 }, C.gun + 0.1);
      tl.to(S + "r-brow", { rotation: 14, svgOrigin: "74 -43", duration: 0.2 }, C.rex + 0.6);
      tl.to(S + "r-jaw", { rotation: 32, svgOrigin: "0 18", duration: 0.3, ease: "power2.out" }, C.roar);
      tl.to(S + "r-jaw", { rotation: 0, svgOrigin: "0 18", duration: 0.25 }, C.roar + 1.3);
      tl.fromTo(S + "roar", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, C.roar + 0.1);
      tl.to(S + "roar", { opacity: 0, duration: 0.2 }, C.roar + 1.3);
      // Bolt notices he is behind
      tl.to([S + "b-pupL", S + "b-pupR"], { x: 6, duration: 0.25 }, C.ahead);
      swap(S + "b-m-flat", S + "b-m-o", C.ahead + 0.1);
