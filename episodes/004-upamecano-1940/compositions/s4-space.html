    <div class="card " id="s4-space-c-sp" data-layout-allow-overflow data-layout-allow-overlap style="left: 500px; top: 540px;"><div class="ck">THE ARDENNES</div><div class="cv">A lot of space</div></div>
    <div class="card gold" id="s4-space-c-lv" data-layout-allow-overflow data-layout-allow-overlap style="left: 560px; top: 380px;"><div class="ck">UPAMECANO</div><div class="cv">♥ space</div></div>
    <div class="card " id="s4-space-c-hl" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 540px;"><div class="ck">DEFENSIVE LINE</div><div class="cv">Very high</div></div>
    <div class="card gold" id="s4-space-c-no" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 380px;"><div class="ck">TANKS THROUGH THE HALF-SPACE</div><div class="cv">0</div></div>
    <div class="dip" id="s4-space-dip" data-layout-ignore></div>

  <script>
    (function () {
      const S = "#s4-space-";
      const D = 14.121;
      const C = {"t": 0.877, "space": 1.938, "loves": 4.418, "line": 5.97, "shift": 8.059, "none": 11.026};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s4-space-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s4-space"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      fly("b", C.t, C.space + 1.2);
      fly("sp", C.space, C.loves - 0.1, { from: "right" });
      fly("lv", C.loves, C.line - 0.1, { from: "right" });
      pop(S + "heart", C.loves + 0.3);
      tl.to(S + "heart", { y: -60, opacity: 0, duration: 1.0 }, C.loves + 1.2);
      swap(S + "u-m-smile", S + "u-m-o", C.space + 0.3); swap(S + "u-m-o", S + "u-m-smile", C.loves + 0.2);
      for (let i = 0; i < 3; i++) tl.fromTo(S + "k" + i + "t-body", { y: 0 }, { y: -3, duration: 0.12, repeat: R(D, 0.12), yoyo: true }, 0);
      // the high line: he steps up, the board's back four step up with him
      fly("hl", C.line, C.shift - 0.1);
      tl.fromTo(S + "line", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.line);
      tl.to([S + "kwrap", S + "line"], { x: 160, duration: 0.6, ease: "power2.inOut" }, C.line + 0.4);
      tl.to(S + "def", { x: 160, duration: 0.6, ease: "power2.inOut" }, C.line + 0.4);
      // shifts across the entire forest (and the board)
      const s0 = C.shift + 0.2, n = R(C.none - s0, 0.5);
      tl.fromTo(S + "kwrap", { x: 160 }, { x: 560, duration: 0.5, ease: "sine.inOut", repeat: n, yoyo: true }, s0);
      tl.fromTo(S + "def", { y: 0 }, { y: -70, duration: 0.5, ease: "sine.inOut", repeat: n, yoyo: true }, s0);
      tl.fromTo(S + "speed", { opacity: 0 }, { opacity: 0.85, duration: 0.2 }, s0);
      tl.to(S + "speed", { opacity: 0, duration: 0.2 }, C.none - 0.2);
      // not one tank gets through
      fly("no", C.none, null, { from: "top" });
      for (let i = 0; i < 3; i++) { swap(S + "k" + i + "t-smirk", S + "k" + i + "t-o", C.none + 0.3 + i * 0.1); tl.to(S + "k" + i, { x: 40, duration: 0.3, ease: "power2.out" }, C.none + 0.2); }
      tl.to([S + "a0", S + "a1", S + "a2"], { opacity: 0.25, duration: 0.3 }, C.none + 0.3);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s4-space"] = tl;
    })();
  </script>
</template>
