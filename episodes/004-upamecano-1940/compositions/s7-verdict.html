    <div class="card red" id="s7-verdict-c-p2" data-layout-allow-overflow data-layout-allow-overlap style="left: 60px; top: 560px;"><div class="ck">CHANCE OF ONE EASY MISTAKE</div><div class="cv"><span id="s7-verdict-p3v">also 99 %</span></div></div>

  <script>
    (function () {
      const S = "#s7-verdict-";
      const D = 21.867;
      const C = {"q": 0.887, "yes": 4.45, "but": 5.55, "risk": 6.876, "oops": 11.38, "p1": 13.98, "p2": 16.08, "p3": 19.267};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s7-verdict-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s7-verdict"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      fly("b", 0.1, C.yes - 0.15, { from: "top" });
      for (let i = 0; i < 4; i++) tl.fromTo(S + "k" + i + "t-body", { y: 0 }, { y: -3, duration: 0.12, repeat: R(D, 0.12), yoyo: true }, 0);
      // YES.
      tl.fromTo(S + "stamp", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.18, ease: "power4.in" }, C.yes);
      tl.fromTo(S + "svg", { x: 0 }, { x: 10, duration: 0.04, repeat: 5, yoyo: true }, C.yes + 0.18);
      tl.to(S + "stamp", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power2.in" }, C.but - 0.1);
      tl.to(S + "u-armL", { rotation: -60, duration: 0.3 }, C.yes + 0.3);
      tl.to(S + "u-armR", { rotation: 60, duration: 0.3 }, C.yes + 0.35);
      // the small risk: nobody presses him at all
      fly("rk", C.but, C.p1 - 0.1);
      tl.fromTo(S + "zz", { opacity: 0, y: 0 }, { opacity: 1, y: -40, duration: 1.2, ease: "sine.out", repeat: 2 }, C.risk);
      tl.to([S + "u-armL", S + "u-armR"], { rotation: 0, duration: 0.3 }, C.risk);
      // one simple pass ... straight to a tank
      const pass = C.oops - 0.6;
      tl.to(S + "u-legR", { rotation: -40, duration: 0.15, yoyo: true, repeat: 1 }, pass);
      tl.fromTo(S + "ball", { x: 0, rotation: 0 }, { x: 420, rotation: 720, duration: 0.6, ease: "power1.out" }, pass + 0.1);
      tl.fromTo(S + "oops", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, C.oops + 0.15);
      tl.to(S + "oops", { opacity: 0, duration: 0.2 }, C.oops + 1.2);
      tl.to(S + "zz", { opacity: 0, duration: 0.1 }, C.oops);
      swap(S + "u-m-smile", S + "u-m-o", C.oops + 0.1);
      tl.to(S + "u-armL", { rotation: 165, duration: 0.25 }, C.oops + 0.3);
      tl.to(S + "u-armR", { rotation: -165, duration: 0.25 }, C.oops + 0.35);
      // ... and the entire army walks past him
      for (let i = 0; i < 4; i++) {
        swap(S + "k" + i + "t-smirk", S + "k" + i + "t-grin", C.oops + 0.4);
        tl.to(S + "k" + i, { x: -1500, duration: 2.6, ease: "power1.in" }, C.oops + 0.6 + i * 0.25);
      }
      tl.to(S + "ball", { x: -1100, duration: 2.6, ease: "power1.in" }, C.oops + 0.6);
      tl.to([S + "u-pupL", S + "u-pupR"], { x: -7, duration: 0.6 }, C.oops + 1.2);
      fly("p1", C.p1, null);
      fly("p2", C.p2, null, { from: "right" });
      tl.fromTo(S + "p3v", { opacity: 0 }, { opacity: 1, duration: 0.15 }, C.p3);

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);

      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s7-verdict"] = tl;
    })();
  </script>
