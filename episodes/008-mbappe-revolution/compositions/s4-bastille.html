  <script>
    (function () {
      const S = "#s4-bastille-";
      const D = 9.893;
      const C = {"t": 0.511, "crowd": 1.882, "mb": 3.83, "pris": 5.843, "fans": 8.043};
      const tl = gsap.timeline({ paused: true });
      const turb = document.getElementById("s4-bastille-turb");
      tl.to({}, { duration: D, ease: "none", onUpdate() { turb.setAttribute("seed", 1 + (Math.floor(this.time() * 12) % 9)); } }, 0);
      // rig pivots: limbs swing from their top, heads nod from the neck
      const root = document.querySelector('[data-composition-id="s4-bastille"]');
      root.querySelectorAll('[id$="-armL"],[id$="-armR"],[id$="-legL"],[id$="-legR"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 0%" }));
      root.querySelectorAll('g[id$="-head"]').forEach((el) => gsap.set(el, { transformOrigin: "50% 100%" }));
      const R = (len, cycle) => Math.max(0, Math.floor(len / cycle) - 1);
      // fact cards: fly in on a cue, land with a small overshoot, hold still, fly out
      const fly = (name, tin, tout, o = {}) => {
        const el = S + "c-" + name, dir = o.from === "right" ? 1 : -1, rot = o.rot ?? (dir < 0 ? -3 : 3);
        const inFrom = o.from === "top" ? { y: -900, x: 0 } : { x: dir * 1300, y: 0 };
        tl.fromTo(el, { ...inFrom, rotation: dir * 18, opacity: 1 }, { x: 0, y: 0, rotation: rot, duration: 0.55, ease: "back.out(1.5)" }, tin);
        if (tout != null && tout < D - 0.05) {
          // leave the way it came, so cards never cross each other
          const outTo = o.from === "top" || o.out === "up" ? { y: -1100 } : { x: dir * 1400 };
          tl.to(el, { ...outTo, rotation: dir * 14, duration: 0.38, ease: "power3.in" }, tout);
        }
      };
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, at);
      const swap = (hide, showSel, at) => { tl.set(hide, { opacity: 0 }, at); tl.set(showSel, { opacity: 1 }, at); };
      const blink = (lids, at) => { tl.set(lids, { opacity: 1 }, at); tl.set(lids, { opacity: 0 }, at + 0.12); };
      const waves = (a, b) => {
        tl.fromTo(a, { x: 0 }, { x: -160, duration: 2, ease: "none", repeat: R(D, 2) }, 0);
        if (b) tl.fromTo(b, { x: 0 }, { x: -160, duration: 1.4, ease: "none", repeat: R(D, 1.4) }, 0);
        // fish under the surface swim slowly left and bob
        [1, 2, 3].forEach((i) => {
          const f = a.replace("-waves1", "-fish" + i);
          if (!document.querySelector(f)) return;
          tl.fromTo(f, { x: 0 }, { x: -(60 + i * 25) * D / 4, duration: D, ease: "none" }, 0);
          tl.fromTo(f, { y: -6 }, { y: 6, duration: 0.9 + i * 0.2, ease: "sine.inOut", repeat: R(D, 0.9 + i * 0.2), yoyo: true }, 0);
        });
      };
      const puffs = (pfx) => {
        [1, 2, 3, 4].forEach((i) => tl.fromTo(`${pfx}-smoke${i}`, { y: 0, x: 0, scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" },
          { y: -70, x: -30, scale: 1.8, opacity: 0, duration: 1.6, ease: "power1.out", repeat: R(D - i * 0.35, 1.6) }, i * 0.35));
      };

      const label = (id, steps) => {
        const el = document.querySelector(S + id);
        tl.to({}, { duration: D, ease: "none", onUpdate() {
          const t = this.time(); let txt = steps[0][1];
          for (const [at, s] of steps) if (t >= at) txt = s;
          if (el.textContent !== txt) el.textContent = txt;
        } }, 0);
      };
      const count = (id, a, b, t0, d, ease = "power2.out", suffix = "") => {
        const el = document.querySelector(S + id), o = { v: a };
        el.textContent = a.toLocaleString("en-US") + suffix;
        tl.fromTo(o, { v: a }, { v: b, duration: d, ease, onUpdate() { el.textContent = Math.round(o.v).toLocaleString("en-US") + suffix; } }, t0);
      };
      const look = (p, x, y, at, d = 0.2) => tl.to([S + p + "-pupL", S + p + "-pupR"], { x, y, duration: d }, at);
      const needle = (deg, at, d = 0.6) => tl.to(S + "needle", { rotation: deg, transformOrigin: "50% 100%", duration: d, ease: "back.out(1.6)" }, at);
      // Mbappé (rig prefix p, default "m") crosses his arms / lets them go
      const cross = (at, p = "m") => { tl.to(S + p + "-armL", { rotation: -62, duration: 0.25, ease: "back.out(2)" }, at); tl.to(S + p + "-armR", { rotation: 62, duration: 0.25, ease: "back.out(2)" }, at); };
      const uncross = (at, p = "m") => tl.to([S + p + "-armL", S + p + "-armR"], { rotation: 0, duration: 0.25 }, at);
      const run = (t0, t1, p = "m", cyc = 0.14) => {
        const n = R(t1 - t0, cyc);
        tl.fromTo(S + p + "-legL", { rotation: -30 }, { rotation: 30, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + p + "-legR", { rotation: 30 }, { rotation: -30, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + p + "-armL", { rotation: 30 }, { rotation: -30, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + p + "-armR", { rotation: -30 }, { rotation: 30, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.to([S + p + "-legL", S + p + "-legR", S + p + "-armL", S + p + "-armR"], { rotation: 0, duration: 0.12 }, t1);
      };
      // horse gallop (prefix p = Napoleon part prefix)
      const gallop = (t0, t1, p = "n", cyc = 0.2) => {
        const n = R(t1 - t0, cyc);
        [["-hFL", -30, 30], ["-hFR", 30, -30], ["-hBL", 25, -25], ["-hBR", -25, 25]].forEach(([l, a, b]) =>
          tl.fromTo(S + p + l, { rotation: a }, { rotation: b, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0));
        tl.fromTo(S + p + "-horse", { y: 0 }, { y: -18, duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.fromTo(S + p + "-cloak", { rotation: 0 }, { rotation: 10, transformOrigin: "100% 0%", duration: cyc, ease: "sine.inOut", yoyo: true, repeat: n }, t0);
        tl.to([S + p + "-hFL", S + p + "-hFR", S + p + "-hBL", S + p + "-hBR"], { rotation: 0, duration: 0.15 }, t1);
      };
      const kickR = (at, p = "m") => {
        tl.to(S + p + "-legR", { rotation: 35, duration: 0.12, ease: "power2.in" }, at - 0.14);
        tl.to(S + p + "-legR", { rotation: -55, duration: 0.08, ease: "power3.out" }, at - 0.02);
        tl.to(S + p + "-legR", { rotation: 0, duration: 0.2 }, at + 0.1);
      };
      // parabolic flight of an element (offsets dx, dy, apex h)
      const arc = (sel, t0, d, dx, dy, h) => {
        const el = document.querySelector(sel), o = { p: 0 };
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: "none", onUpdate() { const p = o.p; gsap.set(el, { x: dx * p, y: dy * p - 4 * h * p * (1 - p) }); } }, t0);
      };
      const stampIn = (at) => {
        tl.fromTo(S + "stamp", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.18, ease: "power4.in" }, at);
        tl.fromTo(S + "svg", { x: 0 }, { x: 10, duration: 0.04, repeat: 5, yoyo: true }, at + 0.18);
      };
      // crowd wave: row by row, the copies swap to the arms-crossed pose
      const crossWave = (name, rows, cols, t0, step = 0.25) => {
        for (let r = rows - 1; r >= 0; r--) for (let c = 0; c < cols; c++) {
          const at = t0 + (rows - 1 - r) * step + c * 0.03;
          if (!document.querySelector(S + name + r + "-" + c)) continue;
          tl.set(S + name + r + "-" + c, { opacity: 0 }, at); tl.set(S + name + "X" + r + "-" + c, { opacity: 1 }, at);
        }
      };
      const shakeCrowd = (sel, t0, d, amp = 4) => tl.fromTo(sel, { rotation: -amp }, { rotation: amp, transformOrigin: "50% 100%", duration: 0.2, yoyo: true, repeat: R(d, 0.2), ease: "sine.inOut" }, t0);

      fly("b", C.t, C.crowd - 0.1, { from: "top" });
      needle(45, 0, 0.01);
      // the crowd plods along while the sun crosses the sky
      tl.fromTo(S + "crowdA", { x: 0 }, { x: 180, duration: C.pris - C.crowd, ease: "none" }, C.crowd);
      tl.fromTo(S + "cr", { y: 0 }, { y: -6, duration: 0.3, yoyo: true, repeat: R(C.pris, 0.3) }, 0);
      fly("cr", C.crowd, C.mb - 0.1);
      tl.fromTo(S + "ps-sun", { x: -760, y: 160 }, { x: 0, y: 0, duration: C.mb - C.crowd, ease: "sine.out" }, C.crowd);
      tl.fromTo(S + "ps-sky", { fill: "#bfe0f2" }, { fill: "#f6b77a", duration: C.mb - C.crowd }, C.crowd);
      // Mbappé overtakes everyone; the drawbridge slams down; he is first inside
      run(C.mb - 0.1, C.mb + 0.9);
      tl.to(S + "mw", { x: 950, duration: 0.95, ease: "power1.in" }, C.mb);
      tl.to(S + "bs-bridge", { rotation: -90, transformOrigin: "0% 100%", duration: 0.35, ease: "bounce.out" }, C.mb + 0.15);
      tl.to(S + "mw", { opacity: 0, duration: 0.1 }, C.mb + 0.95);
      fly("mb", C.mb + 0.1, C.pris - 0.2, { from: "right" });
      needle(60, C.mb + 0.9);
      // inside: seven prisoners; the door creaks open, he stands in the light, arms crossed
      tl.set(S + "A", { opacity: 0 }, C.pris - 0.15); tl.set(S + "B", { opacity: 1 }, C.pris - 0.15);
      tl.set(S + "d-armL", { rotation: -62 }, 0); tl.set(S + "d-armR", { rotation: 62 }, 0);
      tl.fromTo(S + "ce-door", { scaleX: 1 }, { scaleX: 0.12, transformOrigin: "100% 50%", duration: 0.6, ease: "power2.out" }, C.pris);
      tl.fromTo(S + "ce-light", { opacity: 0 }, { opacity: 0.6, duration: 0.5 }, C.pris + 0.1);
      tl.fromTo(S + "dw", { opacity: 0 }, { opacity: 1, duration: 0.2 }, C.pris + 0.3);
      [0, 1, 2, 3, 4, 5, 6].forEach((i) => {
        const p = "p" + i + "p";
        tl.set(S + p + "-fork", { opacity: 0 }, 0);
        tl.set(S + p + "-m-o", { opacity: 0 }, 0);
        tl.set(S + p + "-lids", { opacity: 1 }, 0);
        tl.set(S + p + "-head", { rotation: 14 }, 0);
        tl.set(S + p + "-lids", { opacity: 0 }, C.pris + 0.6 + i * 0.05);
        tl.to(S + p + "-head", { rotation: 0, duration: 0.3 }, C.pris + 0.6 + i * 0.05);
        look(p, 6, 0, C.pris + 0.7);
        // ... seven new fans: they jump and cheer
        tl.set(S + p + "-m-smile", { opacity: 1 }, C.fans);
        tl.to(S + p + "-armL", { rotation: 150, duration: 0.2 }, C.fans + i * 0.04);
        tl.to(S + p + "-armR", { rotation: -150, duration: 0.2 }, C.fans + i * 0.04);
        tl.fromTo(S + "p" + i, { y: 0 }, { y: -60, duration: 0.2, yoyo: true, repeat: 3, ease: "power2.out" }, C.fans + i * 0.04);
      });
      fly("pr", C.pris + 0.2, C.fans - 0.1);
      fly("fa", C.fans, null, { from: "right" });

      tl.fromTo(S + "dip", { opacity: 0 }, { opacity: 0.45, duration: 0.1, ease: "none" }, D - 0.1);
      // render end -> start once so every element starts in its earliest state
      tl.progress(1).progress(0);
      window.__timelines["s4-bastille"] = tl;
    })();
  </script>
</template>
